# Mavericks Swift Toolchain: clang reads this file from its own bin/ as clang.cfg and clang++.cfg, which
# scripts/stage-toolchain.sh ships in both toolchain pkgs, as mavericks-clang-22 ships its cfgs in both.
# -mmacosx-version-min=10.9: a bare clang or clang++ builds for OS X 10.9 on a modern Mac, as it does on
#   10.9 itself, where that is the host's version. The SDK is fetched per user
#   (libexec/mavergreen-swift/fetch_sdk.sh), so a compile names it with -isysroot or $SDKROOT.
#   A later -mmacosx-version-min=<v> raises it silently. A versioned -target or --target raises it
#   too, but clang warns "overriding '-mmacosx-version-min=10.9' option" (an error under -Werror;
#   -Wno-overriding-option on the command line silences it, not here), and so does swiftc -target,
#   on 10.9 too, where no -Xcc flag silences it. mavericks-clang-22's native and cross clang.cfg
#   carry the same flag, so its clang warns the same.
# -Wl,-U,__availability_version_check: C's @available calls compiler-rt's __isPlatformVersionAtLeast,
#   whose os_version_check.o weak-imports _availability_version_check (macOS 10.15 and later) and falls
#   back to reading SystemVersion.plist when it is absent. The 10.9 SDK declares no such symbol, so the
#   link fails without this; -U lets that one symbol stay undefined and weak, as compiler-rt intends.
# $-Wl,<CFGDIR>/../lib/recaulk/librecaulk.a: every program clang or clang++ links takes Recaulk, as
#   mavericks-clang-22's clang.cfg arranges (its archive is at lib/librecaulk.a; ours has lib/recaulk,
#   beside its notices.tsv). Recaulk's fma, fmal and truncl fix 10.9's libm, and ld takes a member only for
#   a symbol still undefined, so a program defines those (hidden) and binds the rest to libSystem as
#   before. The `$` makes it link-only: a compile never sees it, so `clang -c` neither warns nor fails and
#   swift-frontend's Clang importer ignores it. <CFGDIR> is this file's directory, so it moves with the
#   toolchain. clang's driver puts it before its own -lSystem, which the archive must precede. One path
#   only: clang runs bin/ld64.lld itself, never libexec/mavergreen-swift/ld (the linker swiftc's driver
#   runs, which adds the same archive for swiftc), so nothing adds it twice.
# swift-frontend's Clang importer reads this file too; what swiftc builds is the same bytes without it.
-mmacosx-version-min=10.9
-Wl,-U,__availability_version_check
$-Wl,<CFGDIR>/../lib/recaulk/librecaulk.a
