name: linux-build

# The runtime built on Linux, with no macOS runner: the Linux-hosted compiler (build-toolchain.sh --host linux, this
# repo's compiler and llvm patches, its Swift half compiled by swift.org's Linux toolchain), then build.sh with it,
# the runtime pkg with its updater and, when asked, the self-test bundle, uploaded as the artifact swift-linux.
# linux-runtime.yml calls it on every push and gates that bundle on 10.9 (vm-test.yml, prebuilt); release.yml calls
# it beside build-cross, and collect compares the two runtime pkgs. Nothing it builds ships.
#
# The compiler is built only when something its build reads changes, and is cached under
# swift-linux-compiler-<runner.os>-x86_64-<hash>: the hash is scripts/compiler-cache-inputs.sh's, over the scripts
# COMPILER_BUILD names (the only list of them, which the compiler jobs run): every repo file they read, and the
# closure of the shipyard scripts they run, from the shipyard each job installed. Never the runner image, nor
# shipyard's version. A hit skips every compiler job. A miss builds it cold in three jobs, since 12 cores took
# 2 h 24 min (build-llvm.sh 30 min, LLVM 65, swift-frontend 49) and a 4-vCPU runner takes about three times that,
# more than GitHub's six hours for one job: compiler-tools (build-llvm.sh, build-builtins.sh), compiler-llvm
# (build-toolchain.sh --stop-after llvm) and compiler-swift (build-toolchain.sh, which finds LLVM built and goes
# on, then the save). Each hands its work dirs to the next as a same-run artifact, a tar that keeps their times,
# and every job builds under the same path, so CMake's and ninja's records stay true.

on:
  workflow_call:
    inputs:
      version:
        description: "The version the runtime pkg carries (release.yml: the run's); empty, <SWIFT_VERSION>-dev.<run id>, never published"
        type: string
        default: ''
      selftest:
        description: "Build the self-test bundle too (vm-test.yml's prebuilt mode gates it)"
        type: boolean
        default: true
    outputs:
      version:
        description: "The version the runtime pkg carries"
        value: ${{ jobs.runtime.outputs.version }}

permissions:
  contents: read

env:
  # spec: DEVELOPING.md "In CI" -- the scripts the compiler build runs, named once: the compiler jobs run these, and
  #       the key hashes what they read (tests/cache-key-test.sh holds the key to them).
  COMPILER_BUILD: build-llvm.sh build-builtins.sh build-toolchain.sh
  MAVERICKS_USE_CCACHE: "1"   # build-toolchain.sh launches its compilers through ccache

jobs:
  # Is the compiler cached? Only a lookup: the runtime job restores it.
  compiler-probe:
    runs-on: ubuntu-latest
    outputs:
      hit: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: Hash what the compiler's build reads
        id: inputs
        run: |
          sh scripts/compiler-cache-inputs.sh $COMPILER_BUILD
          h="$(sh scripts/compiler-cache-inputs.sh --hash $COMPILER_BUILD)"
          echo "hash=$h" >> "$GITHUB_OUTPUT"
      - name: Look the compiler up
        id: probe
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/mm-build/swift/work/toolchain-linux
            ${{ runner.temp }}/mm-build/swift/work/llvm-build/bin/lld
            ${{ runner.temp }}/mm-build/swift/work/llvm-build/bin/ld64.lld
            ${{ runner.temp }}/mm-build/swift/out/llvm
          key: swift-linux-compiler-${{ runner.os }}-x86_64-${{ steps.inputs.outputs.hash }}
          lookup-only: true

  # LLVM's build support and lld (build.sh links the runtime with it), and compiler-rt's builtins for 10.9.
  compiler-tools:
    needs: [compiler-probe]
    if: needs.compiler-probe.outputs.hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
      - name: The clang22 release components/clang22/version pins
        id: pins
        run: |
          clang22="$(cat components/clang22/version)"
          echo "clang22=$clang22" >> "$GITHUB_OUTPUT"
      - name: Install mavericks-shipyard and clang22
        uses: Mavergreen/shipyard/.github/actions/install@v1
        with:
          products: clang22@${{ steps.pins.outputs.clang22 }}
      - name: The Linux host's packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq uuid-dev pkg-config ninja-build ccache
      - name: Room for the build
        run: |
          df -h / | tail -1
          # platform: the runner leaves too little of / free for LLVM's source, two LLVM builds and the seed; these
          #           preinstalled SDKs are the largest, and no step here uses them.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Build out of tree
        run: |
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
          echo "SWIFT_BUILD=$RUNNER_TEMP/mm-build/swift" >> "$GITHUB_ENV"
      - name: Build the LLVM build support and lld
        run: ./build-llvm.sh
      - name: Build compiler-rt's builtins (x86_64, 10.9)
        run: ./build-builtins.sh
      - name: Hand the work on
        run: tar --zstd -cf "$RUNNER_TEMP/linux-compiler-tools.tar.zst" -C "$SWIFT_BUILD" work/llvm-project work/llvm-build work/builtins-x86 out/llvm
      - uses: actions/upload-artifact@v7
        with:
          name: linux-compiler-tools
          path: ${{ runner.temp }}/linux-compiler-tools.tar.zst
          retention-days: 1
          compression-level: 0

  # LLVM, clang, lld and dsymutil for a Linux host: the longest stage, alone in its job.
  compiler-llvm:
    needs: [compiler-probe, compiler-tools]
    if: needs.compiler-probe.outputs.hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: The Linux host's packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq uuid-dev pkg-config ninja-build ccache
      - name: Room for the build
        run: |
          df -h / | tail -1
          # platform: as compiler-tools'
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Build out of tree
        run: |
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
          echo "SWIFT_BUILD=$RUNNER_TEMP/mm-build/swift" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      # Content-addressed, so a stale entry can only miss, never change a result.
      - name: Restore ccache (LLVM)
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-linux-compiler-llvm-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-linux-compiler-llvm-
      - uses: actions/download-artifact@v8
        with: { name: linux-compiler-tools, path: "${{ runner.temp }}" }
      - name: Take compiler-tools' work
        run: |
          mkdir -p "$SWIFT_BUILD"
          tar --zstd -xf "$RUNNER_TEMP/linux-compiler-tools.tar.zst" -C "$SWIFT_BUILD" && rm "$RUNNER_TEMP/linux-compiler-tools.tar.zst"
      - name: Build LLVM, clang, lld and dsymutil for the Linux host
        id: llvm
        run: ./build-toolchain.sh --host linux --stop-after llvm
      - name: ccache statistics
        if: ${{ !cancelled() && steps.llvm.outcome != 'skipped' }}
        run: ccache -s
      - name: Save ccache (LLVM), even when the build failed
        if: ${{ !cancelled() && steps.llvm.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-linux-compiler-llvm-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Hand the work on
        run: tar --zstd -cf "$RUNNER_TEMP/linux-compiler-llvm.tar.zst" -C "$SWIFT_BUILD" work/llvm-linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux-compiler-llvm
          path: ${{ runner.temp }}/linux-compiler-llvm.tar.zst
          retention-days: 1
          compression-level: 0

  # cmark and swift-frontend, the prefix staged and checked, and the compiler cached.
  compiler-swift:
    needs: [compiler-probe, compiler-llvm]
    if: needs.compiler-probe.outputs.hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: The Linux host's packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq uuid-dev pkg-config ninja-build ccache
      - name: Room for the build
        run: |
          df -h / | tail -1
          # platform: as compiler-tools'
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Build out of tree
        run: |
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
          echo "SWIFT_BUILD=$RUNNER_TEMP/mm-build/swift" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      - name: Hash what the compiler's build reads
        id: inputs
        run: |
          sh scripts/compiler-cache-inputs.sh $COMPILER_BUILD
          h="$(sh scripts/compiler-cache-inputs.sh --hash $COMPILER_BUILD)"
          echo "hash=$h" >> "$GITHUB_OUTPUT"
      - name: Restore ccache (swift)
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-linux-compiler-swift-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-linux-compiler-swift-
      - uses: actions/download-artifact@v8
        with: { name: linux-compiler-tools, path: "${{ runner.temp }}" }
      - uses: actions/download-artifact@v8
        with: { name: linux-compiler-llvm, path: "${{ runner.temp }}" }
      - name: Take compiler-tools' and compiler-llvm's work
        run: |
          mkdir -p "$SWIFT_BUILD"
          for a in linux-compiler-tools linux-compiler-llvm; do
            tar --zstd -xf "$RUNNER_TEMP/$a.tar.zst" -C "$SWIFT_BUILD" && rm "$RUNNER_TEMP/$a.tar.zst"
          done
      # LLVM is built, so its ninja finds nothing to do; swift-frontend then builds and the prefix is staged.
      - name: Build the Linux-hosted compiler (cmark, swift-frontend; its Swift half by the swift.org Linux seed)
        id: swift
        run: ./build-toolchain.sh --host linux
      - name: ccache statistics
        if: ${{ !cancelled() && steps.swift.outcome != 'skipped' }}
        run: ccache -s
      - name: Save ccache (swift), even when the build failed
        if: ${{ !cancelled() && steps.swift.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-linux-compiler-swift-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Cache the compiler
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/mm-build/swift/work/toolchain-linux
            ${{ runner.temp }}/mm-build/swift/work/llvm-build/bin/lld
            ${{ runner.temp }}/mm-build/swift/work/llvm-build/bin/ld64.lld
            ${{ runner.temp }}/mm-build/swift/out/llvm
          key: swift-linux-compiler-${{ runner.os }}-x86_64-${{ steps.inputs.outputs.hash }}

  # The runtime, with the cached compiler: build.sh, the pkg with its updater, and the bundle when asked.
  runtime:
    needs: [compiler-probe, compiler-swift]
    if: ${{ !cancelled() && needs.compiler-probe.result == 'success' && (needs.compiler-probe.outputs.hit == 'true' || needs.compiler-swift.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The clang22 release components/clang22/version pins
        id: pins
        run: |
          clang22="$(cat components/clang22/version)"
          echo "clang22=$clang22" >> "$GITHUB_OUTPUT"
      - name: Install mavericks-shipyard and clang22
        uses: Mavergreen/shipyard/.github/actions/install@v1
        with:
          products: clang22@${{ steps.pins.outputs.clang22 }}
      - name: The Linux host's packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq uuid-dev pkg-config ninja-build ccache
      - name: Build out of tree
        run: |
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
          echo "SWIFT_BUILD=$RUNNER_TEMP/mm-build/swift" >> "$GITHUB_ENV"
      - name: Hash what the compiler's build reads
        id: inputs
        run: |
          sh scripts/compiler-cache-inputs.sh $COMPILER_BUILD
          h="$(sh scripts/compiler-cache-inputs.sh --hash $COMPILER_BUILD)"
          echo "hash=$h" >> "$GITHUB_OUTPUT"
      # A miss here is a key that changed since this run built or found the compiler (shipyard moved): re-run all jobs.
      - name: Restore the compiler
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/mm-build/swift/work/toolchain-linux
            ${{ runner.temp }}/mm-build/swift/work/llvm-build/bin/lld
            ${{ runner.temp }}/mm-build/swift/work/llvm-build/bin/ld64.lld
            ${{ runner.temp }}/mm-build/swift/out/llvm
          key: swift-linux-compiler-${{ runner.os }}-x86_64-${{ steps.inputs.outputs.hash }}
          fail-on-cache-miss: true
      - name: The version the pkg carries
        id: version
        env:
          VERSION_IN: ${{ inputs.version }}
        run: |
          up="$(sh scripts/derive-upstream-version.sh)"
          v="${VERSION_IN:-$up-dev.$GITHUB_RUN_ID}"
          printf '%s\n' "$v" > VERSION   # a build product; every later step reads this one
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version $v"
      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record
      - name: The cached compiler
        run: |
          echo "SWIFT_HOST_TOOLCHAIN=$SWIFT_BUILD/work/toolchain-linux" >> "$GITHUB_ENV"
          "$SWIFT_BUILD/work/toolchain-linux/bin/swift-frontend" -version
      # The prefix declares no release, so the run's version is declared for it, as build-cross declares its own.
      - name: Build the stdlib and the runtime with the Linux-hosted compiler
        run: |
          SWIFT_HOST_TOOLCHAIN_VERSION="$(cat VERSION)" ./build.sh
      # The builtins archive too: the compiler was cached, and the guard reads today's INGREDIENTS.md.
      - name: Compat guard over the runtime and the builtins it linked (must pass)
        run: |
          CL="$(./fetch-clang22.sh)"
          export LIPO="$CL/bin/llvm-lipo" OTOOL="$CL/bin/llvm-otool" NM="$CL/bin/llvm-nm" STRINGS="$CL/bin/llvm-strings"
          ./scripts/guard.sh "$SWIFT_BUILD/payload/runtime/usr/local/mavergreen/swift-runtime/lib/swift"/*.dylib
          ./scripts/guard.sh "$SWIFT_HOST_TOOLCHAIN"/lib/clang/*/lib/darwin/libclang_rt.osx.a
      # llvm patch 0007: the Linux-hosted compiler lays out an optimized async function's frame as the Mac's does.
      - name: Coroutine frame layout of the Linux-hosted compiler
        run: |
          CORO_FRAME_ORDER_REQUIRED=1 sh tests/coro-frame-order-test.sh
      - name: Build swift-runtime-updater.app (Cocoa/Sparkle, by clang22; must NOT link Swift)
        run: sh scripts/build-runtime-updater.sh
      - name: Package runtime .pkg (10.9.5 floor; stages the manifest, updater + LaunchAgent)
        run: REQUIRE_UPDATER=1 ./package.sh
      - name: Build the self-test bundle with the Linux-hosted compiler
        if: inputs.selftest
        run: |
          SELFTEST_SUPPORT="$SWIFT_BUILD/payload/selftest-support" ./make-selftest.sh
      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"
      - name: Upload the runtime pkg and the self-test bundle
        uses: actions/upload-artifact@v7
        with:
          name: swift-linux
          path: |
            ${{ env.SWIFT_BUILD }}/dist/swift-runtime-*.pkg
            ${{ env.SWIFT_BUILD }}/dist/swift-runtime-selftest.tar.gz
          if-no-files-found: error
