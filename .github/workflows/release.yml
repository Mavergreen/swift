name: release

# Build libswiftCore FROM SOURCE for OS X 10.9 / x86_64 on a macOS 26 runner, then a Swift toolchain
# that runs on 10.9 (build-toolchain.sh) with the same stdlib; package each as a .pkg with its own
# Sparkle updater, sign both, and attach the .pkgs + signed appcasts to one GitHub Release. Tags ARE
# the version -- no `v` prefix; see VERSION.
#
# The host build environment is built here too: build-llvm.sh (swiftlang LLVM build support) and
# mirror-toolchain.sh (the swift.org compiler, signer-verified), both pinned in pins.env.
#
# RELEASE GATING: CI proves the build succeeds and the compat guard passes -- necessary hygiene, but
# a macOS 26 runner is structurally blind to the 10.9-only behaviour this runtime exists to fix (it
# needs six source patches for exactly that reason). ACCEPTANCE is manual real-10.9 validation:
# install the .pkg on real 10.9.5 and run it. This runtime was validated 500/500 + Guard Malloc /
# MallocScribble there. Do not treat CI green as acceptance. The toolchain's acceptance is the same
# real-10.9 gate: on 10.9, with its .pkg installed, build the corpus with
# `SWIFTC=/usr/local/mavergreen/bin/swiftc sh make-selftest.sh` and run it (`run-selftest.sh --gate`).
# CI's Rosetta smoke (tests/toolchain-smoke-test.sh) only proves the staged toolchain compiles and
# links for 10.9; it runs nothing it builds.
# (The automated self-test bundle + 10.9 gate were dropped this release; the hand-rolled self-test
# linked Increment-1 siblings the core .pkg doesn't ship. They return rebuilt to match the .pkg.)

on:
  push:
    branches: ['**']          # regular build on every push -- surfaces breaks off the release path
    tags: ['*-mavericks.*']   # tags ARE the version, no `v` prefix (see VERSION)
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut and publish a repackage of the shipped upstream (-mavericks.N+1)"
        type: boolean
        default: false

permissions:
  contents: write

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a *-mavericks.* tag, a workflow_dispatch) is keyed per RUN and is
# therefore alone in its group: never queued, never evicted, never cancelled.
#
# cancel-in-progress:false was never the protection it looked like: it protects the RUNNING job and
# not the QUEUED one -- GitHub keeps only the newest pending run per group and cancels the rest -- so
# the old shared group discarded runs silently. golang lost one on 2026-09-09, 13 seconds after the
# run that evicted it.
#
# A push to main HERE CAN PUBLISH (an upstream with no release yet auto-cuts -mavericks.1), and
# concurrency is resolved when a run is queued -- before the ver step decides whether this one
# releases -- so cancelling the run would cancel the publish job with it.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 355   # safety cap under GitHub's 360; the toolchain cross-build is hours cold (mavergreen-clang's cap)
    env:
      MAVERICKS_USE_CCACHE: "1"   # build-toolchain.sh launches its compilers through ccache
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Both the derived version and assert_appcast_upgradeable.sh order this release against the
          # existing *-mavericks.* tags, so the full history has to be here.
          fetch-depth: 0

      # shipyard installs itself via its own action (HTTPS via the runner token): the pkg, which puts
      # shipyard-cmake on PATH and exports $SHIPYARD_SCRIPTS. Consumed thereafter via
      # find_package(MavericksShipyard) under shipyard-cmake, and via msc.sh in the shell scripts.
      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Ensure ccache
        run: command -v ccache >/dev/null 2>&1 || brew install ccache

      # Content-addressed, so a stale entry can only miss, never change a result.
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-swift-${{ hashFiles('pins.env','patches/**','native-helpers/**','build-toolchain.sh') }}
          restore-keys: ccache-${{ runner.os }}-swift-

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Build out of tree
        run: |
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
          echo "SWIFT_BUILD=$RUNNER_TEMP/mm-build/swift" >> "$GITHUB_ENV"

      # The shared runner takes the whole top-level suite, so a newly added test runs the day it
      # lands. run-selftest.sh needs the runtime installed on a real 10.9 box, so here it exits 77
      # and is reported SKIP rather than failing a run that was never going to have one.
      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      # Derived, so there is nothing for a tag to disagree with. What this replaces -- "tag must equal
      # the committed VERSION" -- made every release a commit-to-main then tag ritual, and the commit
      # is the step branch protection denies to bots.
      - name: Derive the upstream version from the pin
        run: sh scripts/derive-upstream-version.sh

      # Three ways to publish, matching the rest of the family:
      #   - a *-mavericks.* tag: VER = the tag (a hand-cut release).
      #   - workflow_dispatch(local_release=true): a REPACKAGE of the shipped upstream, N+1.
      #     Dispatched by repackage-on-ingredient-bump.yml when an ingredient pin moves.
      #   - a push to main whose upstream has no release yet: auto-cut N=1. version.sh says
      #     RELEASE=yes exactly when this upstream has no tag, so a Renovate SWIFT_VERSION bump ships
      #     with nothing extra to detect.
      # Anything else builds and gates without publishing.
      #
      # NOTE this does not weaken the acceptance rule above: publishing is still not acceptance.
      # A 10.9 user reaches this build through Sparkle, which is where real-hardware breakage shows.
      - name: Resolve the version + decide whether this run publishes
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            VER="${GITHUB_REF_NAME}"; PUBLISH=true
          else
            mode=auto
            if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${{ inputs.local_release }}" = "true" ]; then
              mode=local
            fi
            out="$(sh "$SHIPYARD_SCRIPTS/version.sh" "$mode")"
            VER="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
            REL="$(printf '%s\n' "$out" | sed -n 's/^RELEASE=//p')"
            if [ "$mode" = local ]; then
              PUBLISH=true
            elif [ "$REL" = yes ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              PUBLISH=true            # new upstream, first release
            else
              PUBLISH=false
            fi
          fi
          printf '%s\n' "$VER" > VERSION     # a build product; every later step reads this one
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "version=$VER publish=$PUBLISH"

      # Only build-toolchain.sh compiles through ccache; these steps build cold every run. Every input
      # is pinned and verified, so correctness never depends on cache state.
      - name: Build the LLVM build support (TableGen + CMake package; nothing links LLVM)
        run: ./build-llvm.sh

      - name: Fetch the swift.org compiler (verbatim; signer must match pins.env)
        run: ./mirror-toolchain.sh

      - name: Build the runtime (patched stdlib, 10.9 / x86_64)
        run: ./build.sh

      - name: Compat guard (must pass)
        run: ./scripts/guard.sh "$SWIFT_BUILD/payload/runtime/usr/local/mavergreen/swift-runtime/lib/swift"/*.dylib

      - name: Build swift-runtime-updater.app (Cocoa/Sparkle; must NOT link Swift)
        run: |
          # The Sparkle framework is fetched inside mavericks_add_updater_app (mavericks_fetch_sparkle).
          shipyard-cmake -S . -B "$SWIFT_BUILD/build/updater" -DCMAKE_OBJC_COMPILER=/usr/bin/clang \
            -DCMAKE_TOOLCHAIN_FILE="$SHIPYARD_SCRIPTS/../MavericksToolchain.cmake"
          shipyard-cmake --build "$SWIFT_BUILD/build/updater" --target swift-runtime-updater
          otool -L "$SWIFT_BUILD/build/updater/swift-runtime-updater.app/Contents/MacOS/swift-runtime-updater" > /tmp/o.txt
          cat /tmp/o.txt
          ! grep -q 'libswift' /tmp/o.txt || { echo "::error::updater links a Swift runtime library (self-update circularity)"; exit 1; }

      - name: Package runtime .pkg (10.9.5 floor; stages the manifest, updater + LaunchAgent)
        run: REQUIRE_UPDATER=1 ./package.sh

      - name: Disk before the toolchain build
        run: df -h "$RUNNER_TEMP" | tail -1

      - name: Build the native toolchain (swift-frontend, lld and clang for 10.9; ccache)
        id: toolchain
        run: ./build-toolchain.sh

      # The restore step saves only when the whole job succeeds, and a cold build that fails late would
      # lose hours of ccache (mavergreen-clang's pattern: a cache key can never be overwritten, so this
      # saves under a per-run key the restore prefix finds).
      - name: Save ccache, even when the build or a later step fails
        if: ${{ !cancelled() && steps.toolchain.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-swift-${{ hashFiles('pins.env','patches/**','native-helpers/**','build-toolchain.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stage the toolchain payload
        run: |
          sh scripts/stage-toolchain.sh "$SWIFT_BUILD/payload/toolchain"
          du -sh "$SWIFT_BUILD/payload/toolchain"; df -h "$RUNNER_TEMP" | tail -1

      # Every run, not only publishing ones: conformance (which also checks the SDK pin) runs only when
      # this run publishes.
      - name: Compat guard over the toolchain payload (must pass)
        run: |
          find "$SWIFT_BUILD/payload/toolchain" -type f \( -perm -111 -o -name '*.dylib' \) \
            -exec sh -c 'file "$1" | grep -q Mach-O && echo "$1"' _ {} \; > "$RUNNER_TEMP/toolchain-machos"
          cat "$RUNNER_TEMP/toolchain-machos"
          xargs ./scripts/guard.sh < "$RUNNER_TEMP/toolchain-machos"

      # INGREDIENTS.md declares this: rosetta:.github/workflows/release.yml. The runner is arm64 and the
      # toolchain x86_64, so the smoke below runs its compiler and linker translated.
      - name: Ensure this runner can run x86_64 (Rosetta)
        run: |
          # Already installed is fine (porthole's pattern); an install that fails is a failure here.
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta is already installed"
          else
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      # CI's one run of the toolchain it ships: the staged swiftc compiles and links for 10.9 (see the
      # test's header). Here a SKIP is a failure -- a runner that lost Rosetta would otherwise let a
      # compiler that cannot compile automerge on green.
      - name: Toolchain smoke under Rosetta (the staged swiftc compiles and links; must not skip)
        run: |
          rc=0; sh tests/toolchain-smoke-test.sh || rc=$?
          [ "$rc" -ne 77 ] || { echo "::error::the toolchain smoke SKIPPED, so this run never ran the toolchain it ships"; exit 1; }
          exit "$rc"

      - name: Build swift-toolchain-updater.app (Cocoa/Sparkle; must NOT link Swift)
        run: |
          shipyard-cmake -S . -B "$SWIFT_BUILD/build/updater-toolchain" -DSWIFT_UPDATER_PRODUCT=swift-toolchain \
            -DCMAKE_OBJC_COMPILER=/usr/bin/clang -DCMAKE_TOOLCHAIN_FILE="$SHIPYARD_SCRIPTS/../MavericksToolchain.cmake"
          shipyard-cmake --build "$SWIFT_BUILD/build/updater-toolchain" --target swift-toolchain-updater
          otool -L "$SWIFT_BUILD/build/updater-toolchain/swift-toolchain-updater.app/Contents/MacOS/swift-toolchain-updater" > /tmp/ot.txt
          cat /tmp/ot.txt
          ! grep -q 'libswift' /tmp/ot.txt || { echo "::error::toolchain updater links a Swift runtime library (self-update circularity)"; exit 1; }

      - name: Package the toolchain .pkg (10.9.5 floor; stages the manifest, updater + LaunchAgent)
        run: REQUIRE_UPDATER=1 ./package-toolchain.sh

      # One generator call writes the one file the appcast below and the Release body both read --
      # title, optional committed prose (release-notes/$VER.md, verbatim), What changed, Build
      # ingredients (only when a pin moved), and the footer. A gap it cannot fill honestly (no visible
      # tags, an unreadable ingredient pin) stops the run here rather than shipping a shorter body.
      - name: Generate release notes
        run: |
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p "$SWIFT_BUILD/dist"
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "$VER" --version "$VER" \
            --product Swift --min-os 10.9.5 --out "$SWIFT_BUILD/dist/RELEASE_NOTES.md"

      - name: Sign both .pkgs + generate their Sparkle appcasts
        if: steps.ver.outputs.publish == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via `gh` -> needs auth (else 403 rate-limit)
        run: |
          # printenv, not [ -n "$SPARKLE_PRIVATE_KEY" ]: the shell never expands the key, so no trace can print it
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          SH="$SHIPYARD_SCRIPTS"   # exported by install@v1; don't re-derive it from the registry
          [ -d "$SH" ] || { echo "::error::SHIPYARD_SCRIPTS not set by install@v1"; exit 1; }
          VER="${{ steps.ver.outputs.version }}"
          PKG=$(ls "$SWIFT_BUILD"/dist/swift-runtime-*.pkg | head -1)
          # The tag IS the version, so the download path carries no `v`.
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/$(basename "$PKG")"
          # sign_and_appcast.sh auto-fetches the prebuilt ed25519-sign, signs the pkg, and renders the appcast.
          sh "$SH/sign_and_appcast.sh" --product swift-runtime --feed-dir "$SWIFT_BUILD/dist" \
            --channel-title "Mavericks Swift Runtime" --version "$VER" \
            --pkg-url "$URL" --notes-file "$SWIFT_BUILD/dist/RELEASE_NOTES.md" --pkg "$PKG" --min-os 10.9.5
          echo "=== swift-runtime.xml ==="; cat "$SWIFT_BUILD/dist/swift-runtime.xml"
          TPKG=$(ls "$SWIFT_BUILD"/dist/swift-toolchain-*.pkg | head -1)
          TURL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/$(basename "$TPKG")"
          sh "$SH/sign_and_appcast.sh" --product swift-toolchain --feed-dir "$SWIFT_BUILD/dist" \
            --channel-title "Mavericks Swift Toolchain" --version "$VER" \
            --pkg-url "$TURL" --notes-file "$SWIFT_BUILD/dist/RELEASE_NOTES.md" --pkg "$TPKG" --min-os 10.9.5
          echo "=== swift-toolchain.xml ==="; cat "$SWIFT_BUILD/dist/swift-toolchain.xml"

      # The mirror changes only when Swift does, so it rides the new upstream's first release only
      # (docs/superpowers/specs/2026-09-24-t1a-one-repo-design.md); INGREDIENTS.md declares its
      # conformance deviations.
      - name: Attach the swift.org mirror (a new upstream's first release only)
        if: steps.ver.outputs.publish == 'true'
        run: |
          case "${{ steps.ver.outputs.version }}" in
            *-mavericks.1)
              . ./pins.env
              cp "$SWIFT_BUILD/cache/$TOOLCHAIN_ASSET" "$SWIFT_BUILD/dist/" ;;
            *) echo "not a -mavericks.1 release: no mirror" ;;
          esac

      # NOTE: the self-test bundle is intentionally dropped from this release. The hand-rolled
      # thorough_test linked Increment-1 siblings (libswiftObjectiveC/Darwin) not shipped in the
      # core .pkg, so it only "passed" where those were already installed -- a mirage. It returns
      # in a later release, rebuilt to match exactly what the .pkg ships. Acceptance for this
      # release is the manual real-10.9 validation (500/500 + Guard Malloc/Scribble).

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      # Conformance: do the artifacts about to be published agree with each other and with the
      # family's schemes? Gated on publish, since only a publishing run signs and so has the feed this
      # asks about.
      - name: Artifact conformance
        if: steps.ver.outputs.publish == 'true'
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" "$SWIFT_BUILD/dist" "${{ steps.ver.outputs.version }}" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"
          # Behavior gate: a client on the previous release must SEE this as an upgrade -- a numeric
          # sparkle:version that orders strictly after the last published one (ordering conformance
          # never exercised; the gap the "-mavericks.N compares EQUAL" bug shipped through).
          sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "$SWIFT_BUILD/dist/swift-runtime.xml" --version "${{ steps.ver.outputs.version }}"
          sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "$SWIFT_BUILD/dist/swift-toolchain.xml" --version "${{ steps.ver.outputs.version }}"

      # No SHA256SUMS in the artifact: publish-release.yml regenerates it over everything it attaches.
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: swift
          path: |
            ${{ env.SWIFT_BUILD }}/dist/*.pkg
            ${{ env.SWIFT_BUILD }}/dist/swift-runtime.xml
            ${{ env.SWIFT_BUILD }}/dist/swift-toolchain.xml
            ${{ env.SWIFT_BUILD }}/dist/RELEASE_NOTES.md

  # Before anything is published: no log of this run, and no file about to be released, carries a
  # piece of the signing key. shipyard's publish-release.yml looks for this job's record on any signed
  # release; it cannot run the scan itself (reading job logs needs actions: read).
  scan:
    needs: [build]
    if: always() && (needs.build.outputs.publish == 'true')   # a build that fails after signing left logs too; scan them
    permissions:
      actions: read     # this run's job logs
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: swift
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  publish:
    needs: [build, scan]
    if: needs.build.outputs.publish == 'true'
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.version }}
      artifact: swift

  # The real-10.9 self-test acceptance job is removed with the self-test bundle. Acceptance for this
  # release is manual (install the .pkg on real 10.9; the runtime was validated 500/500 + Guard
  # Malloc/Scribble). An automated 10.9 gate returns when the self-tests are rebuilt to match the .pkg.
