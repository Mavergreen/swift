name: release

# Build libswiftCore FROM SOURCE for OS X 10.9 / x86_64 on a macOS 26 runner, then two Swift toolchains
# with the same stdlib -- one that runs on 10.9 (build-toolchain.sh) and one that runs on an
# Apple-silicon Mac and targets 10.9 (build-toolchain.sh --host arm64) -- package each as a .pkg with its
# own Sparkle updater, sign all three, and attach the .pkgs + signed appcasts to one GitHub Release. Tags
# ARE the version -- no `v` prefix; see VERSION.
#
# Fourteen jobs: `version` resolves the one version every job labels its pkgs with; `build-cross` builds the
# cross toolchain, its Swift half compiled by the swift.org compiler (CI's one seed), then the stdlib --
# built once, by that cross toolchain -- and the runtime pkg; `build` then builds the native toolchain,
# its Swift half compiled by build-cross's toolchain, and stages build-cross's stdlib and builtins in it;
# `collect` checks that both toolchains carry those same bytes, signs, renders the feeds and runs
# conformance over all three pkgs; `scan` and `publish` follow it, and publish also waits for `vm-test`, the
# acceptance on 10.9 (RELEASE GATING, below). Off the release's path, on Linux runners alone, the one Linux path
# per push: `linux-compiler-probe`, `-tools`, `-llvm` and `-swift` build the Linux-hosted compiler when its cache
# misses; `linux-runtime` builds the same commit's runtime, pkg and self-test bundle with it; `vm-test-prebuilt`
# gates that bundle on 10.9; and `equivalence` compares its pkg with build-cross's, warning of each difference.
# publish waits for none of them. CI never builds with an earlier
# release; OS X 10.9 rebuilds the native toolchain with the previous release (self-host.sh), and the
# two must be the same bytes (docs/superpowers/specs/2026-09-25-t4-self-hosting-design.md).
#
# The host build environment is built here too: build-llvm.sh (swiftlang LLVM build support, and the
# lld that links the runtime), build-builtins.sh (compiler-rt's builtins for 10.9) and
# mirror-toolchain.sh (the swift.org compiler, signer-verified), all pinned in pins.env.
#
# RELEASE GATING: a macOS 26 runner is structurally blind to the 10.9-only behaviour this runtime exists to
# fix (it needs six source patches for exactly that reason), so ACCEPTANCE happens on Mac OS X 10.9: the
# vm-test job boots Mavergreen/mavericks-vm's 10.9.5 guest (no Command Line Tools), installs the previous
# release's runtime and native toolchain pkgs and then this run's over them, as a user's upgrade does,
# checks the family install (`mavergreen check`), builds the self-test corpus there with the installed
# swiftc (`SWIFTC=/usr/local/mavergreen/bin/swiftc sh make-selftest.sh`) and runs its gate
# (`run-selftest.sh --gate`: 500x plus 10x under Guard Malloc, -O and -Onone; one upstream pair without
# Guard Malloc, INGREDIENTS.md on-target:cancellation-gmalloc), then the native toolchain's
# smoke (tests/toolchain-smoke-test.sh), natively, on 10.9; publish waits for it. The cross toolchain's
# smoke runs natively in build-cross, on the arm64 runner; its acceptance (the same corpus built on an
# Apple-silicon Mac, gated on 10.9) is still by hand.

on:
  push:
    branches: ['**']          # regular build on every push -- surfaces breaks off the release path
    tags: ['*-mavericks.*']   # tags ARE the version, no `v` prefix (see VERSION)
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut and publish a repackage of the shipped upstream (-mavericks.N+1)"
        type: boolean
        default: false

permissions:
  contents: write

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a *-mavericks.* tag, a workflow_dispatch) is keyed per RUN and is
# therefore alone in its group: never queued, never evicted, never cancelled.
#
# cancel-in-progress:false was never the protection it looked like: it protects the RUNNING job and
# not the QUEUED one -- GitHub keeps only the newest pending run per group and cancels the rest -- so
# the old shared group discarded runs silently. golang lost one on 2026-09-09, 13 seconds after the
# run that evicted it.
#
# A push to main HERE CAN PUBLISH (an upstream with no release yet auto-cuts -mavericks.1), and
# concurrency is resolved when a run is queued -- before the ver step decides whether this one
# releases -- so cancelling the run would cancel the publish job with it.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The scripts the Linux-hosted compiler's build runs, named once: the linux-compiler-* jobs run these, and its
  # cache key hashes what they read (tests/cache-key-test.sh holds the key to them; DEVELOPING.md "In CI").
  COMPILER_BUILD: build-llvm.sh build-builtins.sh build-toolchain.sh

jobs:
  # One version for the whole run: both build jobs label their pkgs with this one (resolve-version.sh
  # reuses a written VERSION: "every job must agree"), and build-cross declares it as the release of the
  # cross toolchain it builds the stdlib with.
  # Linux: version.sh and derive-upstream-version.sh are shell and git, and install@v1 gives a Linux runner
  # shipyard's scripts as it gives a Mac its pkg.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The derived version orders this release against the existing *-mavericks.* tags, so the
          # full history has to be here.
          fetch-depth: 0

      # shipyard installs itself via its own action (HTTPS via the runner token): the pkg, which puts
      # shipyard-cmake on PATH and exports $SHIPYARD_SCRIPTS. Consumed thereafter via
      # find_package(MavericksShipyard) under shipyard-cmake, and via msc.sh in the shell scripts.
      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      # Derived, so there is nothing for a tag to disagree with. What this replaces -- "tag must equal
      # the committed VERSION" -- made every release a commit-to-main then tag ritual, and the commit
      # is the step branch protection denies to bots.
      - name: Derive the upstream version from the pin
        run: sh scripts/derive-upstream-version.sh

      # Three ways to publish, matching the rest of the family:
      #   - a *-mavericks.* tag: VER = the tag (a hand-cut release).
      #   - workflow_dispatch(local_release=true): a REPACKAGE of the shipped upstream, N+1.
      #     Dispatched by repackage-on-ingredient-bump.yml when an ingredient pin moves.
      #   - a push to main whose upstream has no release yet: auto-cut N=1. version.sh says
      #     RELEASE=yes exactly when this upstream has no tag, so a Renovate SWIFT_VERSION bump ships
      #     with nothing extra to detect.
      # Anything else builds and gates without publishing.
      #
      # NOTE this does not weaken the acceptance rule above: publishing is still not acceptance.
      # A 10.9 user reaches this build through Sparkle, which is where real-hardware breakage shows.
      - name: Resolve the version + decide whether this run publishes
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            VER="${GITHUB_REF_NAME}"; PUBLISH=true
          else
            mode=auto
            if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${{ inputs.local_release }}" = "true" ]; then
              mode=local
            fi
            out="$(sh "$SHIPYARD_SCRIPTS/version.sh" "$mode")"
            VER="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
            REL="$(printf '%s\n' "$out" | sed -n 's/^RELEASE=//p')"
            if [ "$mode" = local ]; then
              PUBLISH=true
            elif [ "$REL" = yes ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              PUBLISH=true            # new upstream, first release
            else
              PUBLISH=false
            fi
          fi
          [ -n "$VER" ] || { echo "::error::no version resolved"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "version=$VER publish=$PUBLISH"

  # The cross toolchain, the stdlib and the runtime: arm64, macOS 11.0, built natively on this arm64
  # runner with nothing cross-compiled, its compiler's Swift half compiled by the swift.org compiler --
  # the one seed. The stdlib every pkg ships is then built ONCE, by that cross toolchain; build stages the
  # native toolchain with these same bytes, and collect checks that it did.
  build-cross:
    needs: [version]
    runs-on: macos-26
    timeout-minutes: 355   # the same cap as build's: LLVM and swift-frontend, hours cold
    env:
      MAVERICKS_USE_CCACHE: "1"   # build-toolchain.sh launches its compilers through ccache
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Ensure ccache
        run: command -v ccache >/dev/null 2>&1 || brew install ccache

      # Its own key, disjoint from build's: the arm64 build's objects are not the native build's. The
      # restore prefix (`ccache-<os>-cross-swift-`) is not a prefix of build's key either.
      - name: Restore ccache (cross)
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-cross-swift-${{ hashFiles('pins.env','patches/**','build-toolchain.sh','lib.sh') }}
          restore-keys: ccache-${{ runner.os }}-cross-swift-

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Build out of tree
        run: |
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
          echo "SWIFT_BUILD=$RUNNER_TEMP/mm-build/swift" >> "$GITHUB_ENV"

      - name: Derive the upstream version from the pin, and pin the version the version job resolved
        run: |
          sh scripts/derive-upstream-version.sh
          printf '%s\n' "${{ needs.version.outputs.version }}" > VERSION   # a build product; every later step reads this one

      - name: Build the LLVM build support and lld (TableGen for the cross LLVM; lld links the runtime)
        run: ./build-llvm.sh

      - name: Fetch the swift.org compiler (verbatim; signer must match pins.env)
        run: ./mirror-toolchain.sh

      - name: Build compiler-rt's builtins (x86_64, 10.9; the runtime links them, every toolchain ships them)
        run: ./build-builtins.sh

      # The swift.org compiler's stdlib ships nowhere: it only makes the cross toolchain runnable, so that
      # the cross toolchain can build the stdlib that does ship (below).
      - name: Build a first stdlib with the swift.org compiler (to run the cross toolchain; it ships nowhere)
        run: ./build.sh

      - name: Disk before the toolchain build
        run: df -h "$RUNNER_TEMP" | tail -1

      - name: Build the cross toolchain (swift-frontend, lld and clang for arm64 / macOS 11; ccache)
        id: toolchain
        run: ./build-toolchain.sh --host arm64

      - name: ccache statistics
        if: ${{ !cancelled() && steps.toolchain.outcome != 'skipped' }}
        run: |
          if command -v ccache >/dev/null 2>&1; then ccache -s; else echo "no ccache on PATH: no statistics"; fi

      # As in build: a cold build that fails late must not lose hours of ccache.
      - name: Save ccache (cross), even when the build or a later step fails
        if: ${{ !cancelled() && steps.toolchain.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-cross-swift-${{ hashFiles('pins.env','patches/**','build-toolchain.sh','lib.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stage the cross toolchain with the first stdlib (the stdlib build's host)
        run: STAGE_HOST=arm64 sh scripts/stage-toolchain.sh "$SWIFT_BUILD/payload/toolchain-cross-seed"

      # The ONE stdlib build: this repo's compiler, the cross toolchain above, builds the stdlib and the
      # runtime every pkg ships, as a 10.9 Mac builds them with its toolchain (DEVELOPING.md). No pkg
      # installed that prefix, so its release is declared: the one this run builds.
      - name: Build the stdlib and the runtime with the cross toolchain (the stdlib every pkg ships)
        run: |
          SWIFT_HOST_TOOLCHAIN="$SWIFT_BUILD/payload/toolchain-cross-seed/usr/local/mavergreen/swift-toolchain-cross" \
          SWIFT_HOST_TOOLCHAIN_VERSION="${{ needs.version.outputs.version }}" ./build.sh

      - name: Compat guard over the runtime (must pass)
        run: ./scripts/guard.sh "$SWIFT_BUILD/payload/runtime/usr/local/mavergreen/swift-runtime/lib/swift"/*.dylib

      # The same script builds linux-runtime's updater, so both runtime pkgs carry one.
      - name: Build swift-runtime-updater.app (Cocoa/Sparkle, by clang22; must NOT link Swift)
        run: sh scripts/build-runtime-updater.sh

      - name: Package runtime .pkg (10.9.5 floor; stages the manifest, updater + LaunchAgent)
        run: REQUIRE_UPDATER=1 ./package.sh

      - name: Stage the cross toolchain payload
        run: |
          STAGE_HOST=arm64 sh scripts/stage-toolchain.sh "$SWIFT_BUILD/payload/toolchain-cross"
          du -sh "$SWIFT_BUILD/payload/toolchain-cross"; df -h "$RUNNER_TEMP" | tail -1

      # Two batches: the four tools are arm64 (the family's arm64 pin, minOS 11.0 and SDK 11.3), the six
      # stdlib dylibs x86_64 (the 10.9 target, by their declared sdk-pin deviation).
      - name: Compat guard over the cross toolchain payload (must pass)
        run: |
          P="$SWIFT_BUILD/payload/toolchain-cross/usr/local/mavergreen/swift-toolchain-cross"
          find "$P" -type f \( -perm -111 -o -name '*.dylib' \) \
            -exec sh -c 'file "$1" | grep -q Mach-O && echo "$1"' _ {} \; | sort > "$RUNNER_TEMP/cross-machos"
          cat "$RUNNER_TEMP/cross-machos"
          # Exactly these ten, so nothing new in the payload goes unguarded.
          printf '%s\n' "$P/bin/clang" "$P/bin/dsymutil" "$P/bin/ld64.lld" "$P/bin/swift-frontend" \
            "$P/lib/swift/macosx/libswiftCore.dylib" "$P/lib/swift/macosx/libswiftSwiftOnoneSupport.dylib" \
            "$P/lib/swift/macosx/libswiftDarwin.dylib" "$P/lib/swift/macosx/libswiftObjectiveC.dylib" \
            "$P/lib/swift/macosx/libswiftDispatch.dylib" "$P/lib/swift/macosx/libswift_Concurrency.dylib" | sort > "$RUNNER_TEMP/cross-want"
          cmp -s "$RUNNER_TEMP/cross-machos" "$RUNNER_TEMP/cross-want" \
            || { echo "::error::the cross payload's Mach-O files are not swift-frontend, ld64.lld, clang, dsymutil and the 6 stdlib dylibs"; diff "$RUNNER_TEMP/cross-want" "$RUNNER_TEMP/cross-machos"; exit 1; }
          MAVERICKS_ALLOW_ARCHS=arm64 ./scripts/guard.sh "$P/bin/swift-frontend" "$P/bin/ld64.lld" "$P/bin/clang" "$P/bin/dsymutil"
          ./scripts/guard.sh "$P/lib/swift/macosx/libswiftCore.dylib" "$P/lib/swift/macosx/libswiftSwiftOnoneSupport.dylib" \
            "$P/lib/swift/macosx/libswiftDarwin.dylib" "$P/lib/swift/macosx/libswiftObjectiveC.dylib" \
            "$P/lib/swift/macosx/libswiftDispatch.dylib" "$P/lib/swift/macosx/libswift_Concurrency.dylib"
          # The builtins archive is not executable, so the list above misses it; guard it by name.
          ./scripts/guard.sh "$P"/lib/clang/*/lib/darwin/libclang_rt.osx.a
          # So is Recaulk's, whose members call each other: guarded linked whole (scripts/guard.sh --linked-with).
          ./scripts/guard.sh --linked-with "$P/bin/ld64.lld" "$P/lib/recaulk/librecaulk.a"

      - name: Digest the stdlib and builtins the cross toolchain ships
        id: digest
        run: |
          d="$(. ./lib.sh && toolchain_digest "$SWIFT_BUILD/payload/toolchain-cross/usr/local/mavergreen/swift-toolchain-cross")"
          echo "$d"
          echo "digest=$d" >> "$GITHUB_OUTPUT"

      # The cross toolchain runs natively here, as the native one does on 10.9 in vm-test. A SKIP is a failure.
      - name: Cross toolchain smoke, native arm64 (the staged swiftc compiles and links; must not skip)
        run: |
          rc=0; STAGE_HOST=arm64 sh tests/toolchain-smoke-test.sh || rc=$?
          [ "$rc" -ne 77 ] || { echo "::error::the cross toolchain smoke SKIPPED, so this run never ran the toolchain it ships"; exit 1; }
          exit "$rc"

      # arm64 / macOS 11, where the cross toolchain runs (clang22-cross's updater, CLANG_VARIANT=cross).
      - name: Build swift-toolchain-cross-updater.app (Cocoa/Sparkle, arm64 / macOS 11; must NOT link Swift)
        run: |
          # spec: shipyard's "Apple's clang is a declared deviation, never a default" -- this updater still builds with
          #       /usr/bin/clang; it exits when this step moves to clang22, as swift-runtime-updater's did.
          shipyard-cmake -S . -B "$SWIFT_BUILD/build/updater-toolchain-cross" -DSWIFT_UPDATER_PRODUCT=swift-toolchain-cross \
            -DCMAKE_OBJC_COMPILER=/usr/bin/clang -DCMAKE_TOOLCHAIN_FILE="$SHIPYARD_SCRIPTS/../MavericksToolchain.cmake"
          shipyard-cmake --build "$SWIFT_BUILD/build/updater-toolchain-cross" --target swift-toolchain-cross-updater
          U="$SWIFT_BUILD/build/updater-toolchain-cross/swift-toolchain-cross-updater.app/Contents/MacOS/swift-toolchain-cross-updater"
          otool -L "$U" > /tmp/oc.txt
          cat /tmp/oc.txt
          ! grep -q 'libswift' /tmp/oc.txt || { echo "::error::cross toolchain updater links a Swift runtime library (self-update circularity)"; exit 1; }
          [ "$(lipo -archs "$U")" = arm64 ] || { echo "::error::the cross toolchain updater is $(lipo -archs "$U"), not arm64"; exit 1; }

      - name: Package the cross toolchain .pkg (macOS 11 arm64 floor; stages the manifest, updater + LaunchAgent)
        run: STAGE_HOST=arm64 REQUIRE_UPDATER=1 ./package-toolchain.sh

      # The mirror changes only when Swift does, so it rides the new upstream's first release only
      # (docs/superpowers/specs/2026-09-24-t1a-one-repo-design.md); INGREDIENTS.md declares its
      # conformance deviations. This job fetched it (mirror-toolchain.sh), so it attaches it.
      - name: Attach the swift.org mirror (a new upstream's first release only)
        if: needs.version.outputs.publish == 'true'
        run: |
          case "${{ needs.version.outputs.version }}" in
            *-mavericks.1)
              . ./pins.env
              cp "$SWIFT_BUILD/cache/$TOOLCHAIN_ASSET" "$SWIFT_BUILD/dist/" ;;
            *) echo "not a -mavericks.1 release: no mirror" ;;
          esac

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      # The self-test's support (build.sh's payload/selftest-support: the test-support dylibs and their
      # modules, and upstream's included tests with their compile-lines), for vm-test's bundle; never a
      # pkg, and collect publishes only what it names, so it rides in dist/ as a directory nothing else reads.
      - name: Stage the self-test's support for vm-test
        run: cp -R "$SWIFT_BUILD/payload/selftest-support" "$SWIFT_BUILD/dist/selftest-support"

      # build reads the cross toolchain pkg from this (its compiler's Swift half, and the stdlib and
      # builtins it stages); collect signs every pkg in it, beside build's. On a -mavericks.1 release it
      # carries the swift.org mirror too, so build downloads that once per Swift version. vm-test reads
      # selftest-support/ from it.
      - name: Upload the runtime and cross toolchain pkgs for build and collect, and the self-test's support for vm-test
        uses: actions/upload-artifact@v7
        with:
          name: swift-cross
          path: |
            ${{ env.SWIFT_BUILD }}/dist/*.pkg
            ${{ env.SWIFT_BUILD }}/dist/selftest-support

  # The native toolchain: x86_64, OS X 10.9, cross-compiled with mavericks-clang-22. Its compiler's Swift
  # half is compiled by build-cross's toolchain, the same run's -- never the swift.org compiler, never an
  # earlier release -- against the pinned 11.3 SDK, as self-host.sh compiles it on 10.9 with the previous
  # release; the two seeds share nothing, so a 10.9 build equal to this one is the proof that neither
  # changed it. Its stdlib and builtins are build-cross's, the cross pkg's own bytes.
  #
  # build is main's required check, and GitHub counts a skipped required check as passed: skipped for a
  # failed build-cross, it let PR 9 (6.4.1) automerge with the 6.4.0 tarball pins. So it runs whatever its
  # needs did, and its first step fails unless both succeeded.
  build:
    needs: [version, build-cross]
    if: ${{ !cancelled() }}
    runs-on: macos-26
    timeout-minutes: 355   # safety cap under GitHub's 360; the toolchain cross-build is hours cold (mavergreen-clang's cap)
    env:
      MAVERICKS_USE_CCACHE: "1"   # build-toolchain.sh launches its compilers through ccache
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Fail unless version and build-cross succeeded
        if: ${{ needs.version.result != 'success' || needs.build-cross.result != 'success' }}
        env:
          VERSION_RESULT: ${{ needs.version.result }}
          CROSS_RESULT: ${{ needs.build-cross.result }}
        run: |
          echo "::error::version: $VERSION_RESULT, build-cross: $CROSS_RESULT -- build, the required check, must not pass"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Ensure ccache
        run: command -v ccache >/dev/null 2>&1 || brew install ccache

      # Content-addressed, so a stale entry can only miss, never change a result.
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-swift-${{ hashFiles('pins.env','patches/**','native-helpers/**','build-toolchain.sh','lib.sh') }}
          restore-keys: ccache-${{ runner.os }}-swift-

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Build out of tree
        run: |
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
          echo "SWIFT_BUILD=$RUNNER_TEMP/mm-build/swift" >> "$GITHUB_ENV"

      # The shared runner takes the whole top-level suite, so a newly added test runs the day it
      # lands. run-selftest.sh needs the runtime installed on a real 10.9 box, so here it exits 77
      # and is reported SKIP rather than failing a run that was never going to have one.
      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      - name: Derive the upstream version from the pin, and pin the version the version job resolved
        run: |
          sh scripts/derive-upstream-version.sh
          printf '%s\n' "${{ needs.version.outputs.version }}" > VERSION   # a build product; every later step reads this one

      # Only build-toolchain.sh compiles through ccache. Every input is pinned and verified, so
      # correctness never depends on cache state.
      - name: Build the LLVM build support (TableGen and the native helpers' LLVM, for the cross build)
        run: ./build-llvm.sh

      - uses: actions/download-artifact@v8
        with: { name: swift-cross, path: "${{ runner.temp }}/cross-dist" }

      # The pkg this release ships, unpacked as lib.sh's pkg_extract_product lays it out: the compiler
      # that compiles this toolchain's Swift half, and the stdlib and builtins this toolchain stages.
      # scripts/outdir.sh first: pkg_extract_product refuses to rm -rf its out-dir without its guard;
      # msc.sh for shipyard's stevedore, which reads the pkg.
      - name: Unpack the same run's cross toolchain
        run: |
          . ./scripts/outdir.sh
          . ./msc.sh
          . ./lib.sh
          X="$(pkg_extract_product "$(ls "$RUNNER_TEMP"/cross-dist/swift-toolchain-cross-*.pkg)" swift-toolchain-cross "$RUNNER_TEMP/cross-toolchain")"
          "$X/bin/swift-frontend" -version
          echo "SWIFT_HOST_TOOLCHAIN=$X" >> "$GITHUB_ENV"

      # llvm patch 0007: the cross toolchain lays out an optimized async function's frame in the order the
      # IR alone decides. Required here, so a missing compiler or stdlib fails the step rather than skips it.
      - name: Coroutine frame layout of the same run's cross toolchain
        run: |
          CORO_FRAME_ORDER_REQUIRED=1 sh tests/coro-frame-order-test.sh

      - name: Disk before the toolchain build
        run: df -h "$RUNNER_TEMP" | tail -1

      - name: Build the native toolchain (swift-frontend, lld and clang for 10.9; its Swift half by the cross toolchain; ccache)
        id: toolchain
        run: ./build-toolchain.sh

      # Whether a warm run hits the cache shows here first; absent ccache is no failure.
      - name: ccache statistics
        if: ${{ !cancelled() && steps.toolchain.outcome != 'skipped' }}
        run: |
          if command -v ccache >/dev/null 2>&1; then ccache -s; else echo "no ccache on PATH: no statistics"; fi

      # The restore step saves only when the whole job succeeds, and a cold build that fails late would
      # lose hours of ccache (mavergreen-clang's pattern: a cache key can never be overwritten, so this
      # saves under a per-run key the restore prefix finds).
      - name: Save ccache, even when the build or a later step fails
        if: ${{ !cancelled() && steps.toolchain.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-swift-${{ hashFiles('pins.env','patches/**','native-helpers/**','build-toolchain.sh','lib.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stage the toolchain payload (the cross pkg's stdlib and builtins)
        run: |
          sh scripts/stage-toolchain.sh --stdlib "$SWIFT_HOST_TOOLCHAIN/lib/swift" \
            --builtins "$(ls "$SWIFT_HOST_TOOLCHAIN"/lib/clang/*/lib/darwin/libclang_rt.osx.a)" "$SWIFT_BUILD/payload/toolchain"
          du -sh "$SWIFT_BUILD/payload/toolchain"; df -h "$RUNNER_TEMP" | tail -1

      # collect compares this with build-cross's: the two toolchain pkgs must carry the same stdlib (its
      # dylibs, the swiftmodules whose inlinable code lands in every program, the shims) and builtins
      # archive, byte for byte. This job stages build-cross's, so a difference is a staging fault.
      - name: Digest the stdlib and builtins the native toolchain ships
        id: digest
        run: |
          d="$(. ./lib.sh && toolchain_digest "$SWIFT_BUILD/payload/toolchain/usr/local/mavergreen/swift-toolchain")"
          echo "$d"
          echo "digest=$d" >> "$GITHUB_OUTPUT"

      # Every run, not only publishing ones: conformance (which also checks the SDK pin) runs only when
      # this run publishes.
      - name: Compat guard over the toolchain payload (must pass)
        run: |
          find "$SWIFT_BUILD/payload/toolchain" -type f \( -perm -111 -o -name '*.dylib' \) \
            -exec sh -c 'file "$1" | grep -q Mach-O && echo "$1"' _ {} \; > "$RUNNER_TEMP/toolchain-machos"
          cat "$RUNNER_TEMP/toolchain-machos"
          # BSD xargs runs nothing on empty input, so an empty list would pass unguarded: expect
          # swift-frontend, ld64.lld, clang, dsymutil and the six stdlib dylibs, exactly.
          n="$(wc -l < "$RUNNER_TEMP/toolchain-machos" | tr -d ' ')"
          [ "$n" -eq 10 ] || { echo "::error::the toolchain payload holds $n Mach-O files, not 10 (swift-frontend, ld64.lld, clang, dsymutil, 6 stdlib dylibs)"; exit 1; }
          xargs ./scripts/guard.sh < "$RUNNER_TEMP/toolchain-machos"
          # The builtins archive is not executable, so the list above misses it; guard it by name.
          ./scripts/guard.sh "$SWIFT_BUILD"/payload/toolchain/usr/local/mavergreen/swift-toolchain/lib/clang/*/lib/darwin/libclang_rt.osx.a
          # So is Recaulk's, whose members call each other: guarded linked whole (scripts/guard.sh --linked-with),
          # by the cross toolchain's lld, which runs on this runner.
          ./scripts/guard.sh --linked-with "$SWIFT_HOST_TOOLCHAIN/bin/ld64.lld" \
            "$SWIFT_BUILD/payload/toolchain/usr/local/mavergreen/swift-toolchain/lib/recaulk/librecaulk.a"

      - name: Build swift-toolchain-updater.app (Cocoa/Sparkle; must NOT link Swift)
        run: |
          # spec: shipyard's "Apple's clang is a declared deviation, never a default" -- this updater still builds with
          #       /usr/bin/clang; it exits when this step moves to clang22, as swift-runtime-updater's did.
          shipyard-cmake -S . -B "$SWIFT_BUILD/build/updater-toolchain" -DSWIFT_UPDATER_PRODUCT=swift-toolchain \
            -DCMAKE_OBJC_COMPILER=/usr/bin/clang -DCMAKE_TOOLCHAIN_FILE="$SHIPYARD_SCRIPTS/../MavericksToolchain.cmake"
          shipyard-cmake --build "$SWIFT_BUILD/build/updater-toolchain" --target swift-toolchain-updater
          otool -L "$SWIFT_BUILD/build/updater-toolchain/swift-toolchain-updater.app/Contents/MacOS/swift-toolchain-updater" > /tmp/ot.txt
          cat /tmp/ot.txt
          ! grep -q 'libswift' /tmp/ot.txt || { echo "::error::toolchain updater links a Swift runtime library (self-update circularity)"; exit 1; }

      - name: Package the toolchain .pkg (10.9.5 floor; stages the manifest, updater + LaunchAgent)
        run: REQUIRE_UPDATER=1 ./package-toolchain.sh

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      # collect signs this, beside build-cross's, and publishes all of them as the artifact `swift`.
      - name: Upload the native toolchain pkg for collect
        uses: actions/upload-artifact@v7
        with:
          name: swift-native
          path: ${{ env.SWIFT_BUILD }}/dist/*.pkg

  # All three pkgs exist only here, so this is where the two toolchains are compared, and where the
  # release is signed and checked as a whole (mavergreen-clang's collect).
  collect:
    needs: [version, build, build-cross]
    runs-on: macos-26
    outputs:
      version: ${{ needs.version.outputs.version }}
      publish: ${{ needs.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Both the release notes and assert_appcast_upgradeable.sh order this release against the
          # existing *-mavericks.* tags, so the full history has to be here.
          fetch-depth: 0

      # Every run, publishing or not: two toolchain pkgs that disagree about the stdlib or the builtins
      # would build different programs from one source, which is what one release must never ship. Both
      # carry build-cross's one stdlib build, so a difference here is a staging fault in build.
      - name: The two toolchains carry the same stdlib and builtins archive, byte for byte
        env:
          NATIVE_DIGEST: ${{ needs.build.outputs.digest }}
          CROSS_DIGEST: ${{ needs.build-cross.outputs.digest }}
        run: |
          echo "native: $NATIVE_DIGEST"; echo "cross:  $CROSS_DIGEST"
          . ./lib.sh
          toolchain_digests_agree "$NATIVE_DIGEST" "$CROSS_DIGEST" \
            || { echo "::error::the native and cross toolchains do not carry the same stdlib and builtins"; exit 1; }

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Derive the upstream version from the pin, and pin the version the version job resolved
        run: |
          sh scripts/derive-upstream-version.sh
          printf '%s\n' "${{ needs.version.outputs.version }}" > VERSION

      - uses: actions/download-artifact@v8
        with: { name: swift-native, path: dist }

      - uses: actions/download-artifact@v8
        with: { name: swift-cross, path: dist }

      # One generator call writes the one file the appcasts below and the Release body all read --
      # title, the checked sentences under release-notes/swift-runtime/$VER/, What changed, Build
      # ingredients (only when a pin moved), and the footer. A gap it cannot fill honestly (no visible
      # tags, an unreadable ingredient pin) stops the run here rather than shipping a shorter body.
      # --min-os 10.9.5 describes the runtime and native pkgs. The cross feed signs these same notes, as
      # clang-22, golang and rust sign theirs: conformance requires every appcast's <description> to be
      # the Release body, and its --min-os 11.0 carries the cross toolchain's real floor in
      # <sparkle:minimumSystemVersion>, which is what Sparkle enforces.
      - name: Generate release notes
        run: |
          VER="${{ needs.version.outputs.version }}"
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "$VER" --version "$VER" \
            --product Swift --short swift-runtime --min-os 10.9.5 --out dist/RELEASE_NOTES.md

      - name: Sign the three .pkgs + generate their Sparkle appcasts
        if: needs.version.outputs.publish == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via `gh` -> needs auth (else 403 rate-limit)
        run: |
          # printenv, not [ -n "$SPARKLE_PRIVATE_KEY" ]: the shell never expands the key, so no trace can print it
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          SH="$SHIPYARD_SCRIPTS"   # exported by install@v1; don't re-derive it from the registry
          [ -d "$SH" ] || { echo "::error::SHIPYARD_SCRIPTS not set by install@v1"; exit 1; }
          VER="${{ needs.version.outputs.version }}"
          # The tag IS the version, so the download path carries no `v`.
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER"
          PKG=$(ls dist/swift-runtime-*.pkg | head -1)
          sh "$SH/sign_and_appcast.sh" --product swift-runtime --feed-dir dist \
            --channel-title "Mavericks Swift Runtime" --version "$VER" \
            --pkg-url "$base/$(basename "$PKG")" --notes-file dist/RELEASE_NOTES.md --pkg "$PKG" --min-os 10.9.5
          echo "=== swift-runtime.xml ==="; cat dist/swift-runtime.xml
          TPKG=$(ls dist/swift-toolchain-[0-9]*.pkg | head -1)
          sh "$SH/sign_and_appcast.sh" --product swift-toolchain --feed-dir dist \
            --channel-title "Mavericks Swift Toolchain" --version "$VER" \
            --pkg-url "$base/$(basename "$TPKG")" --notes-file dist/RELEASE_NOTES.md --pkg "$TPKG" --min-os 10.9.5
          echo "=== swift-toolchain.xml ==="; cat dist/swift-toolchain.xml
          XPKG=$(ls dist/swift-toolchain-cross-*.pkg | head -1)
          sh "$SH/sign_and_appcast.sh" --product swift-toolchain-cross --feed-dir dist \
            --channel-title "Mavericks Swift Toolchain (cross)" --version "$VER" \
            --pkg-url "$base/$(basename "$XPKG")" --notes-file dist/RELEASE_NOTES.md --pkg "$XPKG" --min-os 11.0
          echo "=== swift-toolchain-cross.xml ==="; cat dist/swift-toolchain-cross.xml

      # Conformance: do the artifacts about to be published agree with each other and with the
      # family's schemes? Gated on publish, since only a publishing run signs and so has the feeds this
      # asks about.
      - name: Artifact conformance
        if: needs.version.outputs.publish == 'true'
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" dist "${{ needs.version.outputs.version }}" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"
          # Behavior gate: a client on the previous release must SEE this as an upgrade -- a numeric
          # sparkle:version that orders strictly after the last published one (ordering conformance
          # never exercised; the gap the "-mavericks.N compares EQUAL" bug shipped through).
          for a in swift-runtime swift-toolchain swift-toolchain-cross; do
            sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "dist/$a.xml" --version "${{ needs.version.outputs.version }}"
          done

      # No SHA256SUMS in the artifact: publish-release.yml regenerates it over everything it attaches.
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: swift
          path: |
            dist/*.pkg
            dist/swift-runtime.xml
            dist/swift-toolchain.xml
            dist/swift-toolchain-cross.xml
            dist/RELEASE_NOTES.md

  # Before anything is published: no log of this run, and no file about to be released, carries a
  # piece of the signing key. shipyard's publish-release.yml looks for this job's record on any signed
  # release; it cannot run the scan itself (reading job logs needs actions: read).
  scan:
    needs: [collect]
    if: always() && (needs.collect.outputs.publish == 'true')   # a collect that fails after signing left logs too; scan them
    permissions:
      actions: read     # this run's job logs
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: swift
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  publish:
    needs: [collect, scan, vm-test]
    if: needs.collect.outputs.publish == 'true'
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.collect.outputs.version }}
      artifact: swift

  # Acceptance on Mac OS X 10.9 (Mavergreen/mavericks-vm: a 10.9.5 guest without the Command Line Tools), every
  # run: the previous release's runtime and native toolchain pkgs install there, then this run's over them (an
  # upgrade, as a user's is), the family install checks, the installed swiftc builds the self-test bundle on 10.9
  # itself (make-selftest.sh's SWIFTC= mode), and the bundle's gate runs against the installed runtime: 500x plus
  # 10x under Guard Malloc, at -O and -Onone, after a --loads run (each test once, every libswift* read from where it
  # must load from), and upstream's own tests (build-cross's selftest-support) at 20x plus 1x under Guard Malloc.
  # Then the native toolchain's smoke runs, natively, its load commands read with mavericks-clang-22's llvm-otool
  # and llvm-nm (10.9's are Command Line Tools stubs), installed, with the Longboat its pkg requires, before the
  # self-test is built: the gate checks upstream's tests' output with FileCheck, which only clang22 ships. What the
  # guest installs is fetched by .github/actions/vm-test (bundle_mode compile). publish waits for it.
  vm-test:
    name: vm-test
    needs: [version, build-cross, build]
    runs-on: ubuntu-latest
    timeout-minutes: 335   # sized in INGREDIENTS ("Every Swift bump merges on green"): 334 binaries to compile and gate, about 168 min at worst
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Fetch what the 10.9 guest installs (bundle_mode compile)
        uses: ./.github/actions/vm-test
        with:
          bundle_mode: compile
          publish: ${{ needs.version.outputs.publish }}
      - name: Install the pkgs, build the self-test with the installed swiftc, and gate it, on Mac OS X 10.9
        id: vm
        uses: Mavergreen/mavericks-vm@v1
        env:
          SWIFT_FULL_VERSION: ${{ needs.version.outputs.version }}
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          envs: SWIFT_FULL_VERSION
          copyback: false
          run: |
            set -eu
            sw_vers
            if [ -e /Library/Developer/CommandLineTools ]; then echo "this guest has the Command Line Tools"; else echo "this guest has no Command Line Tools"; fi
            sudo -n true || { echo "the guest's user cannot sudo without a password, and installer needs root"; exit 1; }
            # installer says only "an error"; the reason (a preinstall's refusal, say) is in install.log.
            install() { for p in "$@"; do [ -f "$p" ] || { echo "no $p"; exit 1; }
              sudo installer -pkg "$p" -target / || { tail -40 /var/log/install.log; exit 1; }; done; }
            install libcxx/libcxx22-*.pkg prev/swift-runtime-*.pkg prev/swift-toolchain-[0-9]*.pkg
            echo "upgrading from: $(/usr/local/mavergreen/bin/swiftc -version 2>&1 | head -1)"
            install dist/swift-runtime-*.pkg dist/swift-toolchain-[0-9]*.pkg
            for id in dev.mavergreen.swift-runtime dev.mavergreen.swift-toolchain; do
              got="$(pkgutil --pkg-info "$id" | sed -n 's/^version: //p')"
              [ "$got" = "$SWIFT_FULL_VERSION" ] || { echo "$id is $got after the upgrade, not $SWIFT_FULL_VERSION"; exit 1; }
            done
            /usr/local/bin/mavergreen check
            /usr/local/mavergreen/bin/swiftc -version
            # spec: INGREDIENTS.md "Every Swift bump merges on green, the real-10.9 gate included" -- FileCheck (clang22's) checks the gate's output, so clang22 and Longboat go in before the self-test is built.
            install longboat/longboat-[0-9]*.pkg
            # platform: mavericks-clang-22's preinstall refuses without Longboat's 10.9 SDK (dev.mavergreen.longboat.sdk109) installed.
            sudo /usr/local/mavergreen/bin/longboat sdk install 10.9
            install clang22/mavericks-clang-22-native-*.pkg
            # Upstream's tests too (dist/selftest-support, build-cross's). Their support modules are binary
            # .swiftmodule files, which only the compiler that wrote them reads: build-cross's cross toolchain,
            # this release's Swift, as the native swiftc installed above is.
            SWIFTC=/usr/local/mavergreen/bin/swiftc SELFTEST_SUPPORT="$PWD/dist/selftest-support" MAVERICKS_BUILD_ROOT="$HOME/mm-build" DIST="$PWD/gate" sh make-selftest.sh
            # platform: Guard Malloc makes cancellation_handler_concurrent too slow for the 2-vCPU guest; real 10.9 covers it (INGREDIENTS.md on-target:cancellation-gmalloc).
            # platform: 10.9's sh (bash 3.2.53) has a set -e that does not stop for a failing ( ... && ... ) subshell.
            ( cd gate && tar -xzf swift-runtime-selftest.tar.gz && sh swift-runtime-selftest/run-selftest.sh --loads &&
              SELFTEST_NO_GMALLOC="upstream/bin/concurrency-cancellation_handler_concurrent upstream/bin/concurrency-cancellation_handler_concurrent-Onone" \
              sh swift-runtime-selftest/run-selftest.sh --gate ) || exit 1
            rc=0; MAVERICKS_BUILD_ROOT="$HOME/mm-smoke" sh tests/toolchain-smoke-test.sh || rc=$?
            [ "$rc" -ne 77 ] || { echo "the native toolchain smoke SKIPPED on 10.9"; exit 1; }
            exit "$rc"
      # spec: mavericks-vm's logs-dir output -- on a failure, the boot's serial console and what the guest
      #       logged; a guest that stops answering ssh (exit 255) is otherwise a log with no cause in it.
      - name: Keep the 10.9 guest's logs when it fails
        if: failure() && steps.vm.outputs.logs-dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: mavericks-vm-logs
          path: ${{ steps.vm.outputs.logs-dir }}
          if-no-files-found: warn

  # The Linux-hosted compiler (build-toolchain.sh --host linux), cached under
  # swift-linux-compiler-<runner.os>-x86_64-<hash>: the hash is scripts/compiler-cache-inputs.sh's, over the scripts
  # COMPILER_BUILD names (the only list of them, which the compiler jobs run): every repo file they read, and the
  # closure of the shipyard scripts they run, from the shipyard each job installed; never the runner image, nor
  # shipyard's version. A hit skips every compiler job. A miss builds it cold in three jobs, since 12 cores took
  # 2 h 24 min (build-llvm.sh 30 min, LLVM 65, swift-frontend 49) and a 4-vCPU runner takes about three times that,
  # more than GitHub's six hours for one job. Each hands its work dirs to the next as a same-run artifact, a tar that
  # keeps their times, and every job builds under the same path, so CMake's and ninja's records stay true.
  # Is the compiler cached? Only a lookup: linux-runtime restores it.
  linux-compiler-probe:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      hit: ${{ steps.probe.outputs.cache-hit }}
      shipyard: ${{ steps.shipyard.outputs.version }}
      hash: ${{ steps.inputs.outputs.hash }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1
      # The only install@v1 of the Linux jobs: the version it resolves is every later Linux stage's.
      - name: The shipyard version this run builds with
        id: shipyard
        run: |
          [ -n "${SHIPYARD_VERSION:-}" ] || { echo "::error::install@v1 named no shipyard version, so the later stages could not pin it"; exit 1; }
          echo "version=$SHIPYARD_VERSION" >> "$GITHUB_OUTPUT"
          echo "shipyard $SHIPYARD_VERSION, for every Linux stage of this run"
      - name: Hash what the compiler's build reads
        id: inputs
        run: |
          sh scripts/compiler-cache-inputs.sh $COMPILER_BUILD
          h="$(sh scripts/compiler-cache-inputs.sh --hash $COMPILER_BUILD)"
          echo "hash=$h" >> "$GITHUB_OUTPUT"
      - name: Look the compiler up
        id: probe
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/mm-build/swift/work/toolchain-linux
            ${{ runner.temp }}/mm-build/swift/work/llvm-build/bin/lld
            ${{ runner.temp }}/mm-build/swift/work/llvm-build/bin/ld64.lld
            ${{ runner.temp }}/mm-build/swift/out/llvm
          key: swift-linux-compiler-${{ runner.os }}-x86_64-${{ steps.inputs.outputs.hash }}
          lookup-only: true

  # LLVM's build support and lld (build.sh links the runtime with it), and compiler-rt's builtins for 10.9.
  linux-compiler-tools:
    needs: [linux-compiler-probe]
    if: needs.linux-compiler-probe.outputs.hit != 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    timeout-minutes: 355
    env:
      MAVERICKS_USE_CCACHE: "1"   # build-toolchain.sh launches its compilers through ccache
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: The clang22 release components/clang22/version pins
        id: pins
        run: |
          clang22="$(cat components/clang22/version)"
          echo "clang22=$clang22" >> "$GITHUB_OUTPUT"
      # One shipyard for the whole run: linux-compiler-probe's. install@v1 would give a later stage whatever shipyard
      # published since, and the cold chain spans hours.
      - name: Check out shipyard at linux-compiler-probe's version
        uses: actions/checkout@v7
        with:
          repository: Mavergreen/shipyard
          ref: v${{ needs.linux-compiler-probe.outputs.shipyard }}
          path: .shipyard
          persist-credentials: false
      - name: Install mavericks-shipyard and clang22 (linux-compiler-probe's version)
        uses: ./.shipyard/.github/actions/install
        with:
          products: clang22@${{ steps.pins.outputs.clang22 }}
      # platform: an action from a checkout has no ref to name its version by, so the probe's is said here.
      - name: Say which shipyard this is
        env:
          PINNED: ${{ needs.linux-compiler-probe.outputs.shipyard }}
        run: echo "SHIPYARD_VERSION=$PINNED" >> "$GITHUB_ENV"
      # The probe's hash is the run's: a job whose shipyard hashes otherwise would build, or restore, a compiler the
      # key it was looked up under does not describe.
      - name: Hash what the compiler's build reads (linux-compiler-probe's hash, or stop)
        id: inputs
        env:
          PROBE_HASH: ${{ needs.linux-compiler-probe.outputs.hash }}
        run: |
          sh scripts/compiler-cache-inputs.sh $COMPILER_BUILD
          h="$(sh scripts/compiler-cache-inputs.sh --hash $COMPILER_BUILD)"
          echo "hash=$h" >> "$GITHUB_OUTPUT"
          [ "$h" = "$PROBE_HASH" ] || { echo "::error::the compiler's inputs hash to $h here but to $PROBE_HASH in linux-compiler-probe (shipyard moved between jobs?); re-run all jobs"; exit 1; }
      - name: The Linux host's packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq uuid-dev pkg-config ninja-build ccache
      - name: Room for the build
        run: |
          df -h / | tail -1
          # platform: the runner leaves too little of / free for LLVM's source, two LLVM builds and the seed; these
          #           preinstalled SDKs are the largest, and no step here uses them.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Build out of tree
        run: |
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
          echo "SWIFT_BUILD=$RUNNER_TEMP/mm-build/swift" >> "$GITHUB_ENV"
      - name: Build the LLVM build support and lld
        run: ./build-llvm.sh
      - name: Build compiler-rt's builtins (x86_64, 10.9)
        run: ./build-builtins.sh
      - name: Hand the work on
        run: tar --zstd -cf "$RUNNER_TEMP/linux-compiler-tools.tar.zst" -C "$SWIFT_BUILD" work/llvm-project work/llvm-build work/builtins-x86 out/llvm
      - uses: actions/upload-artifact@v7
        with:
          name: linux-compiler-tools
          path: ${{ runner.temp }}/linux-compiler-tools.tar.zst
          retention-days: 1
          compression-level: 0

  # LLVM, clang, lld and dsymutil for a Linux host: the longest stage, alone in its job.
  linux-compiler-llvm:
    needs: [linux-compiler-probe, linux-compiler-tools]
    if: needs.linux-compiler-probe.outputs.hit != 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    timeout-minutes: 355
    env:
      MAVERICKS_USE_CCACHE: "1"   # build-toolchain.sh launches its compilers through ccache
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      # One shipyard for the whole run: linux-compiler-probe's. install@v1 would give a later stage whatever shipyard
      # published since, and the cold chain spans hours.
      - name: Check out shipyard at linux-compiler-probe's version
        uses: actions/checkout@v7
        with:
          repository: Mavergreen/shipyard
          ref: v${{ needs.linux-compiler-probe.outputs.shipyard }}
          path: .shipyard
          persist-credentials: false
      - name: Install mavericks-shipyard (linux-compiler-probe's version)
        uses: ./.shipyard/.github/actions/install
      # platform: an action from a checkout has no ref to name its version by, so the probe's is said here.
      - name: Say which shipyard this is
        env:
          PINNED: ${{ needs.linux-compiler-probe.outputs.shipyard }}
        run: echo "SHIPYARD_VERSION=$PINNED" >> "$GITHUB_ENV"
      # The probe's hash is the run's: a job whose shipyard hashes otherwise would build, or restore, a compiler the
      # key it was looked up under does not describe.
      - name: Hash what the compiler's build reads (linux-compiler-probe's hash, or stop)
        id: inputs
        env:
          PROBE_HASH: ${{ needs.linux-compiler-probe.outputs.hash }}
        run: |
          sh scripts/compiler-cache-inputs.sh $COMPILER_BUILD
          h="$(sh scripts/compiler-cache-inputs.sh --hash $COMPILER_BUILD)"
          echo "hash=$h" >> "$GITHUB_OUTPUT"
          [ "$h" = "$PROBE_HASH" ] || { echo "::error::the compiler's inputs hash to $h here but to $PROBE_HASH in linux-compiler-probe (shipyard moved between jobs?); re-run all jobs"; exit 1; }
      - name: The Linux host's packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq uuid-dev pkg-config ninja-build ccache
      - name: Room for the build
        run: |
          df -h / | tail -1
          # platform: as linux-compiler-tools'
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Build out of tree
        run: |
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
          echo "SWIFT_BUILD=$RUNNER_TEMP/mm-build/swift" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      # Content-addressed, so a stale entry can only miss, never change a result.
      - name: Restore ccache (LLVM)
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-linux-compiler-llvm-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-linux-compiler-llvm-
      - uses: actions/download-artifact@v8
        with: { name: linux-compiler-tools, path: "${{ runner.temp }}" }
      - name: Take linux-compiler-tools' work
        run: |
          mkdir -p "$SWIFT_BUILD"
          tar --zstd -xf "$RUNNER_TEMP/linux-compiler-tools.tar.zst" -C "$SWIFT_BUILD" && rm "$RUNNER_TEMP/linux-compiler-tools.tar.zst"
      - name: Build LLVM, clang, lld and dsymutil for the Linux host
        id: llvm
        run: ./build-toolchain.sh --host linux --stop-after llvm
      - name: ccache statistics
        if: ${{ !cancelled() && steps.llvm.outcome != 'skipped' }}
        run: ccache -s
      - name: Save ccache (LLVM), even when the build failed
        if: ${{ !cancelled() && steps.llvm.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-linux-compiler-llvm-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Hand the work on
        run: tar --zstd -cf "$RUNNER_TEMP/linux-compiler-llvm.tar.zst" -C "$SWIFT_BUILD" work/llvm-linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux-compiler-llvm
          path: ${{ runner.temp }}/linux-compiler-llvm.tar.zst
          retention-days: 1
          compression-level: 0

  # cmark and swift-frontend, the prefix staged and checked, and the compiler cached.
  linux-compiler-swift:
    needs: [linux-compiler-probe, linux-compiler-llvm]
    if: needs.linux-compiler-probe.outputs.hit != 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    timeout-minutes: 355
    env:
      MAVERICKS_USE_CCACHE: "1"   # build-toolchain.sh launches its compilers through ccache
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      # One shipyard for the whole run: linux-compiler-probe's. install@v1 would give a later stage whatever shipyard
      # published since, and the cold chain spans hours.
      - name: Check out shipyard at linux-compiler-probe's version
        uses: actions/checkout@v7
        with:
          repository: Mavergreen/shipyard
          ref: v${{ needs.linux-compiler-probe.outputs.shipyard }}
          path: .shipyard
          persist-credentials: false
      - name: Install mavericks-shipyard (linux-compiler-probe's version)
        uses: ./.shipyard/.github/actions/install
      # platform: an action from a checkout has no ref to name its version by, so the probe's is said here.
      - name: Say which shipyard this is
        env:
          PINNED: ${{ needs.linux-compiler-probe.outputs.shipyard }}
        run: echo "SHIPYARD_VERSION=$PINNED" >> "$GITHUB_ENV"
      - name: The Linux host's packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq uuid-dev pkg-config ninja-build ccache
      - name: Room for the build
        run: |
          df -h / | tail -1
          # platform: as linux-compiler-tools'
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Build out of tree
        run: |
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
          echo "SWIFT_BUILD=$RUNNER_TEMP/mm-build/swift" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      # The probe's hash is the run's: a job whose shipyard hashes otherwise would build, or restore, a compiler the
      # key it was looked up under does not describe.
      - name: Hash what the compiler's build reads (linux-compiler-probe's hash, or stop)
        id: inputs
        env:
          PROBE_HASH: ${{ needs.linux-compiler-probe.outputs.hash }}
        run: |
          sh scripts/compiler-cache-inputs.sh $COMPILER_BUILD
          h="$(sh scripts/compiler-cache-inputs.sh --hash $COMPILER_BUILD)"
          echo "hash=$h" >> "$GITHUB_OUTPUT"
          [ "$h" = "$PROBE_HASH" ] || { echo "::error::the compiler's inputs hash to $h here but to $PROBE_HASH in linux-compiler-probe (shipyard moved between jobs?); re-run all jobs"; exit 1; }
      - name: Restore ccache (swift)
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-linux-compiler-swift-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-linux-compiler-swift-
      - uses: actions/download-artifact@v8
        with: { name: linux-compiler-tools, path: "${{ runner.temp }}" }
      - uses: actions/download-artifact@v8
        with: { name: linux-compiler-llvm, path: "${{ runner.temp }}" }
      - name: Take linux-compiler-tools' and linux-compiler-llvm's work
        run: |
          mkdir -p "$SWIFT_BUILD"
          for a in linux-compiler-tools linux-compiler-llvm; do
            tar --zstd -xf "$RUNNER_TEMP/$a.tar.zst" -C "$SWIFT_BUILD" && rm "$RUNNER_TEMP/$a.tar.zst"
          done
      # LLVM is built, so its ninja should find nothing to do: said here, so a rebuild across the handoff shows.
      - name: Does LLVM's ninja have anything left to do?
        run: |
          # Only said, never a failure: build-toolchain.sh below decides what to build.
          { ninja -C "$SWIFT_BUILD/work/llvm-linux" -n llvm-libraries clang-libraries clang-resource-headers lld clang dsymutil || echo "ninja -n exited $?"; } | tail -1
      - name: Build the Linux-hosted compiler (cmark, swift-frontend; its Swift half by the swift.org Linux seed)
        id: swift
        run: ./build-toolchain.sh --host linux
      - name: ccache statistics
        if: ${{ !cancelled() && steps.swift.outcome != 'skipped' }}
        run: ccache -s
      - name: Save ccache (swift), even when the build failed
        if: ${{ !cancelled() && steps.swift.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-linux-compiler-swift-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Cache the compiler
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/mm-build/swift/work/toolchain-linux
            ${{ runner.temp }}/mm-build/swift/work/llvm-build/bin/lld
            ${{ runner.temp }}/mm-build/swift/work/llvm-build/bin/ld64.lld
            ${{ runner.temp }}/mm-build/swift/out/llvm
          key: swift-linux-compiler-${{ runner.os }}-x86_64-${{ needs.linux-compiler-probe.outputs.hash }}

  # The same commit's runtime, built on Linux with the cached Linux-hosted compiler, at this run's version: build.sh,
  # the coroutine reproducer (required), the pkg with its updater, and the self-test bundle, uploaded as swift-linux.
  # equivalence compares its pkg with build-cross's, and vm-test-prebuilt gates its bundle on 10.9. Nothing it builds
  # ships.
  linux-runtime:
    needs: [version, linux-compiler-probe, linux-compiler-swift]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.linux-compiler-probe.result == 'success' && (needs.linux-compiler-probe.outputs.hit == 'true' || needs.linux-compiler-swift.result == 'success') }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The clang22 release components/clang22/version pins
        id: pins
        run: |
          clang22="$(cat components/clang22/version)"
          echo "clang22=$clang22" >> "$GITHUB_OUTPUT"
      # One shipyard for the whole run: linux-compiler-probe's. install@v1 would give a later stage whatever shipyard
      # published since, and the cold chain spans hours.
      - name: Check out shipyard at linux-compiler-probe's version
        uses: actions/checkout@v7
        with:
          repository: Mavergreen/shipyard
          ref: v${{ needs.linux-compiler-probe.outputs.shipyard }}
          path: .shipyard
          persist-credentials: false
      - name: Install mavericks-shipyard and clang22 (linux-compiler-probe's version)
        uses: ./.shipyard/.github/actions/install
        with:
          products: clang22@${{ steps.pins.outputs.clang22 }}
      # platform: an action from a checkout has no ref to name its version by, so the probe's is said here.
      - name: Say which shipyard this is
        env:
          PINNED: ${{ needs.linux-compiler-probe.outputs.shipyard }}
        run: echo "SHIPYARD_VERSION=$PINNED" >> "$GITHUB_ENV"
      - name: The Linux host's packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq uuid-dev pkg-config ninja-build ccache
      - name: Build out of tree
        run: |
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
          echo "SWIFT_BUILD=$RUNNER_TEMP/mm-build/swift" >> "$GITHUB_ENV"
      # The restore looks up this job's own hash, so it never takes a compiler its inputs do not describe; when that
      # is not the probe's, it misses (shipyard moved since the probe), and the error says why: re-run all jobs.
      - name: Hash what the compiler's build reads (and compare it with linux-compiler-probe's)
        id: inputs
        env:
          PROBE_HASH: ${{ needs.linux-compiler-probe.outputs.hash }}
        run: |
          sh scripts/compiler-cache-inputs.sh $COMPILER_BUILD
          h="$(sh scripts/compiler-cache-inputs.sh --hash $COMPILER_BUILD)"
          echo "hash=$h" >> "$GITHUB_OUTPUT"
          [ "$h" = "$PROBE_HASH" ] || echo "::error::the compiler's inputs hash to $h here but to $PROBE_HASH in linux-compiler-probe (shipyard moved between jobs?); the restore below looks up $h"
      - name: Restore the compiler
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/mm-build/swift/work/toolchain-linux
            ${{ runner.temp }}/mm-build/swift/work/llvm-build/bin/lld
            ${{ runner.temp }}/mm-build/swift/work/llvm-build/bin/ld64.lld
            ${{ runner.temp }}/mm-build/swift/out/llvm
          key: swift-linux-compiler-${{ runner.os }}-x86_64-${{ steps.inputs.outputs.hash }}
          fail-on-cache-miss: true
      - name: The version the pkg carries (the run's)
        env:
          VERSION_IN: ${{ needs.version.outputs.version }}
        run: |
          sh scripts/derive-upstream-version.sh
          printf '%s\n' "$VERSION_IN" > VERSION   # a build product; every later step reads this one
      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record
      - name: The cached compiler
        run: |
          echo "SWIFT_HOST_TOOLCHAIN=$SWIFT_BUILD/work/toolchain-linux" >> "$GITHUB_ENV"
          "$SWIFT_BUILD/work/toolchain-linux/bin/swift-frontend" -version
      # The prefix declares no release, so the run's version is declared for it, as build-cross declares its own.
      - name: Build the stdlib and the runtime with the Linux-hosted compiler
        run: |
          SWIFT_HOST_TOOLCHAIN_VERSION="$(cat VERSION)" ./build.sh
      # The builtins archive too: the compiler was cached, and the guard reads today's INGREDIENTS.md.
      - name: Compat guard over the runtime and the builtins it linked (must pass)
        run: |
          CL="$(./fetch-clang22.sh)"
          export LIPO="$CL/bin/llvm-lipo" OTOOL="$CL/bin/llvm-otool" NM="$CL/bin/llvm-nm" STRINGS="$CL/bin/llvm-strings"
          ./scripts/guard.sh "$SWIFT_BUILD/payload/runtime/usr/local/mavergreen/swift-runtime/lib/swift"/*.dylib
          ./scripts/guard.sh "$SWIFT_HOST_TOOLCHAIN"/lib/clang/*/lib/darwin/libclang_rt.osx.a
      # llvm patch 0007: the Linux-hosted compiler lays out an optimized async function's frame as the Mac's does.
      - name: Coroutine frame layout of the Linux-hosted compiler
        run: |
          CORO_FRAME_ORDER_REQUIRED=1 sh tests/coro-frame-order-test.sh
      - name: Build swift-runtime-updater.app (Cocoa/Sparkle, by clang22; must NOT link Swift)
        run: sh scripts/build-runtime-updater.sh
      - name: Package runtime .pkg (10.9.5 floor; stages the manifest, updater + LaunchAgent)
        run: REQUIRE_UPDATER=1 ./package.sh
      - name: Build the self-test bundle with the Linux-hosted compiler
        run: |
          SELFTEST_SUPPORT="$SWIFT_BUILD/payload/selftest-support" ./make-selftest.sh
      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"
      - name: Upload the runtime pkg and the self-test bundle
        uses: actions/upload-artifact@v7
        with:
          name: swift-linux
          path: |
            ${{ env.SWIFT_BUILD }}/dist/swift-runtime-*.pkg
            ${{ env.SWIFT_BUILD }}/dist/swift-runtime-selftest.tar.gz
          if-no-files-found: error

  # The Linux-built bundle's gate on Mac OS X 10.9: linux-runtime's swift-linux (its runtime pkg and the self-test
  # bundle built beside it) installed in the guest, the runtime's updater launched once, so dyld shows any symbol 10.9
  # lacks, and the bundle's --loads (every libswift* from this runtime) and then its gate. No compile in the guest, no
  # toolchain, no smoke, no previous release. publish does not wait for it while build-cross's runtime is the one
  # that ships; it becomes required, in publish's needs, when Linux becomes the release path.
  vm-test-prebuilt:
    needs: [version, linux-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 335
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Fetch what the 10.9 guest installs (bundle_mode prebuilt)
        uses: ./.github/actions/vm-test
        with:
          bundle_mode: prebuilt
          publish: 'false'
          prebuilt_artifact: swift-linux
      - name: Install the runtime pkg and gate the prebuilt self-test bundle, on Mac OS X 10.9
        id: vm
        uses: Mavergreen/mavericks-vm@v1
        env:
          SWIFT_FULL_VERSION: ${{ needs.version.outputs.version }}
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          envs: SWIFT_FULL_VERSION
          copyback: false
          run: |
            set -eu
            sw_vers
            if [ -e /Library/Developer/CommandLineTools ]; then echo "this guest has the Command Line Tools"; else echo "this guest has no Command Line Tools"; fi
            sudo -n true || { echo "the guest's user cannot sudo without a password, and installer needs root"; exit 1; }
            # installer says only "an error"; the reason (a preinstall's refusal, say) is in install.log.
            install() { for p in "$@"; do [ -f "$p" ] || { echo "no $p"; exit 1; }
              sudo installer -pkg "$p" -target / || { tail -40 /var/log/install.log; exit 1; }; done; }
            [ -f dist/swift-runtime-selftest.tar.gz ] || { echo "no prebuilt bundle at dist/swift-runtime-selftest.tar.gz"; exit 1; }
            install libcxx/libcxx22-*.pkg dist/swift-runtime-*.pkg
            got="$(pkgutil --pkg-info dev.mavergreen.swift-runtime | sed -n 's/^version: //p')"
            [ "$got" = "$SWIFT_FULL_VERSION" ] || { echo "dev.mavergreen.swift-runtime is $got, not $SWIFT_FULL_VERSION"; exit 1; }
            /usr/local/bin/mavergreen check
            # platform: dyld binds every import of the runtime's updater at launch (DYLD_BIND_AT_LAUNCH), so one
            #           launch shows a symbol 10.9 lacks: dyld prints "dyld: ..." and stops the process (SIGTRAP, 133).
            loc="$(pkgutil --pkg-info dev.mavergreen.swift-runtime | sed -n 's/^location: //p')"
            rel="$(pkgutil --files dev.mavergreen.swift-runtime | grep 'swift-runtime-updater\.app/Contents/MacOS/swift-runtime-updater$' | head -1)"
            u="/${loc:+${loc#/}/}$rel"; u="$(printf '%s\n' "$u" | sed 's|//*|/|g')"
            [ -n "$rel" ] && [ -x "$u" ] || { echo "no swift-runtime-updater in the runtime's receipt ($u)"; exit 1; }
            DYLD_BIND_AT_LAUNCH=1 "$u" --background > updater.log 2>&1 &
            pid=$!; sleep 10; kill "$pid" 2>/dev/null || :; rc=0; wait "$pid" || rc=$?
            cat updater.log
            ! grep -q '^dyld: ' updater.log && [ "$rc" -ne 133 ] || { echo "the runtime's updater does not load on 10.9 (exit $rc)"; exit 1; }
            echo "the runtime's updater launched (exit $rc after 10 s)"
            # spec: INGREDIENTS.md "Every Swift bump merges on green, the real-10.9 gate included" -- FileCheck (clang22's) checks the gate's output.
            install longboat/longboat-[0-9]*.pkg
            # platform: mavericks-clang-22's preinstall refuses without Longboat's 10.9 SDK (dev.mavergreen.longboat.sdk109) installed.
            sudo /usr/local/mavergreen/bin/longboat sdk install 10.9
            install clang22/mavericks-clang-22-native-*.pkg
            # spec: tests/run-selftest.sh's --loads -- a bundle built elsewhere must load every libswift* from this runtime, or not be gated.
            # platform: Guard Malloc makes cancellation_handler_concurrent too slow for the 2-vCPU guest; real 10.9 covers it (INGREDIENTS.md on-target:cancellation-gmalloc).
            # platform: 10.9's sh (bash 3.2.53) has a set -e that does not stop for a failing ( ... && ... ) subshell.
            mkdir gate
            ( cd gate && tar -xzf ../dist/swift-runtime-selftest.tar.gz &&
              sh swift-runtime-selftest/run-selftest.sh --loads &&
              SELFTEST_NO_GMALLOC="upstream/bin/concurrency-cancellation_handler_concurrent upstream/bin/concurrency-cancellation_handler_concurrent-Onone" \
              sh swift-runtime-selftest/run-selftest.sh --gate ) || exit 1
      # spec: mavericks-vm's logs-dir output -- on a failure, the boot's serial console and what the guest
      #       logged; a guest that stops answering ssh (exit 255) is otherwise a log with no cause in it.
      - name: Keep the 10.9 guest's logs when it fails
        if: failure() && steps.vm.outputs.logs-dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: mavericks-vm-logs-prebuilt
          path: ${{ steps.vm.outputs.logs-dir }}
          if-no-files-found: warn

  # The same commit's runtime pkg, built on Linux (linux-runtime) and on a Mac (build-cross): shipyard's
  # build-equivalence.sh, with this repo's INGREDIENTS.md entries, on Linux (it is host-agnostic, and reads Mach-O
  # with clang22's llvm-nm, llvm-otool and llvm-lipo). Warnings only, for now: a difference, or no Linux pkg at all,
  # never stops a release, and publish does not wait for this job. When it becomes blocking
  # (build-equivalence.sh in place of scripts/equivalence-warnings.sh), publish gains it in its needs.
  equivalence:
    needs: [version, build-cross, linux-compiler-probe, linux-runtime]
    if: ${{ !cancelled() && needs.build-cross.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: The clang22 release components/clang22/version pins
        id: pins
        run: |
          clang22="$(cat components/clang22/version)"
          echo "clang22=$clang22" >> "$GITHUB_OUTPUT"
      # One shipyard for the whole run: linux-compiler-probe's. install@v1 would give a later stage whatever shipyard
      # published since, and the cold chain spans hours.
      - name: Check out shipyard at linux-compiler-probe's version
        uses: actions/checkout@v7
        with:
          repository: Mavergreen/shipyard
          ref: v${{ needs.linux-compiler-probe.outputs.shipyard }}
          path: .shipyard
          persist-credentials: false
      - name: Install mavericks-shipyard and clang22 (linux-compiler-probe's version)
        uses: ./.shipyard/.github/actions/install
        with:
          products: clang22@${{ steps.pins.outputs.clang22 }}
      # platform: an action from a checkout has no ref to name its version by, so the probe's is said here.
      - name: Say which shipyard this is
        env:
          PINNED: ${{ needs.linux-compiler-probe.outputs.shipyard }}
        run: echo "SHIPYARD_VERSION=$PINNED" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with: { name: swift-cross, path: dist }
      - name: Download the Linux runtime pkg
        if: needs.linux-runtime.result == 'success'
        uses: actions/download-artifact@v8
        with: { name: swift-linux, path: linux-dist }
      - name: The Linux runtime pkg against build-cross's (warnings only)
        env:
          LINUX_RESULT: ${{ needs.linux-runtime.result }}
        run: |
          if [ "$LINUX_RESULT" != success ]; then
            echo "::warning::the Linux runtime job's result is '$LINUX_RESULT', so there is no Linux runtime pkg to compare"
          else
            CL="$(./fetch-clang22.sh)"
            export LIPO="$CL/bin/llvm-lipo" OTOOL="$CL/bin/llvm-otool" NM="$CL/bin/llvm-nm" STRINGS="$CL/bin/llvm-strings"
            sh scripts/equivalence-warnings.sh "$(ls dist/swift-runtime-[0-9]*.pkg)" "$(ls linux-dist/swift-runtime-[0-9]*.pkg)"
          fi
