name: pins-bot

# A Swift bump's Renovate PR moves LLVM_SHA, SWIFT_SHA and CMARK_SHA. The builds fetch each commit as GitHub's
# tarball, verified by a SHA-256 in pins.env that Renovate cannot compute (INGREDIENTS.md), so until those pins
# are filled CI fails at the first fetch. This fills them on Renovate's own branch, in two jobs:
# - pins (contents: read) runs scripts/pin-source-tarballs.sh, which downloads the tarballs and checks with git
#   that each holds exactly its commit's tree. Upstream's bytes are read there, never run, and never beside a
#   token that can write. scripts/pins-bot.sh fill decides: a write only when --check exits 3 (stale); its 1
#   (an error) fails the job, and nothing is written or pushed.
# - push (contents: write, actions: write) touches no upstream byte: it writes the three checked values into
#   pins.env (scripts/pins-bot.sh), commits, and pushes to the branch. A push made with GITHUB_TOKEN starts no
#   workflow, so it then dispatches release.yml on the branch (workflow_dispatch is GITHUB_TOKEN-triggerable, the
#   family's repackage path relies on the same); that run's `build` job is main's required check on the new head.
#   A patch bump then automerges on green; a minor or major one waits for a human (renovate.json).
#   "Never beside a token that can write" is these two jobs' rule. The release.yml run dispatched here builds
#   upstream with release.yml's own permissions (contents: write, workflow-wide; its checkouts keep the token),
#   as the push that opened the branch already started; narrowing those is release.yml's work, not this bot's.
# renovate.json's gitIgnoredAuthors keeps this bot's commit from marking the branch as edited by someone else.

on:
  push:
    branches: ['renovate/**']

permissions: {}

concurrency:
  group: pins-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pins: ${{ steps.pin.outputs.pins }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false   # this job pushes nothing; its token stays out of .git/config

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: The tarball pins, if a source commit moved and its pin is stale
        id: pin
        # pins-bot.sh fill decides by pin-source-tarballs.sh's exit codes: --check 0 (current) is nothing to
        # do; 3 (stale) fills pins.env and prints the three values; anything else (1, an error) fails this
        # job with no values, so the push job never runs on a pin that was not checked.
        run: |
          set -eu
          pins="$(sh scripts/pins-bot.sh fill origin/main)"
          echo "pins=$pins" >> "$GITHUB_OUTPUT"

  push:
    needs: pins
    if: needs.pins.outputs.pins != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Commit the pins to the branch, then run release.yml on its new head
        env:
          PINS: ${{ needs.pins.outputs.pins }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # A refusal fails the job here (set -e sees an assignment's status), never reads as "unchanged".
          # shellcheck disable=SC2086  # three KEY=SHA256 words; pins-bot.sh refuses anything else
          applied="$(sh scripts/pins-bot.sh apply $PINS)"
          [ "$applied" = changed ] || { echo "pins.env already holds them"; exit 0; }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m 'chore(pins): the tarball SHA-256s of the moved source commits' \
            -m 'Written by .github/workflows/pins-bot.yml: its pins job checked, with git, that each tarball is its commit'"'"'s tree.' pins.env
          git push origin "HEAD:refs/heads/$BRANCH"
          gh workflow run release.yml --ref "$BRANCH"
